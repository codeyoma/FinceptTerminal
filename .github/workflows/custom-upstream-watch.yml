# Fork-only workflow (codeyoma/FinceptTerminal).
# Daily: fast-forward `main` to upstream, and merge a new upstream release into
# `custom` by itself:
#   1. When upstream publishes a release newer than custom/UPSTREAM_BASE, merge
#      it on the runner with custom/merge-upstream-release.sh and push the
#      result to the branch upstream-merge/<tag>.
#   2. Start custom-release on that branch as a trial build. When both builds
#      pass, custom-release fast-forwards `custom` to the merge and pushes the
#      tag custom-<tag>-krx.1, which publishes the personal build.
# Nothing reaches `custom` when the merge conflicts or a trial build fails; an
# issue titled "Upstream <tag>: merge needs a hand" says how to finish by hand,
# and the daily run waits while it is open.
name: custom-upstream-watch

on:
  schedule:
    - cron: '0 20 * * *'   # daily 20:00 UTC = 05:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # start the custom-release trial build

concurrency:
  group: custom-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'codeyoma/FinceptTerminal'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      UPSTREAM: Fincept-Corporation/FinceptTerminal
    steps:
      # GITHUB_TOKEN cannot update files under .github/workflows, so a sync
      # that brings upstream workflow changes needs the SYNC_TOKEN secret
      # (fine-grained PAT: Contents + Workflows read/write on this repo).
      - name: Sync main with upstream
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: gh repo sync "$GH_REPO" --branch main

      - name: Report failed sync
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sync of main with upstream failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "The daily sync of \`main\` failed (run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID). This usually means upstream changed workflow files and the \`SYNC_TOKEN\` secret is missing or lacks Contents and Workflows write on this repository. Fix: press **Sync fork** on the repository page, or fix \`SYNC_TOKEN\`."
          fi

      - name: Check for a new upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)
          base=$(gh api "repos/$GH_REPO/contents/custom/UPSTREAM_BASE?ref=custom" -q .content | base64 -d | tr -d '[:space:]')
          # Both tags reach git, branch names, issue titles and searches below.
          # Upstream picks the tag name, so allow only a plain release tag.
          for t in "$latest" "$base"; do
            if [[ ! "$t" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Refusing release tag '$t': expected v followed by letters, digits, '.', '_' or '-'."
              exit 1
            fi
          done
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream latest: $latest, custom base: $base"

      - name: Close the notices of the base release
        if: steps.release.outputs.latest == steps.release.outputs.base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          for title in "Upstream $BASE released" "Upstream $BASE: merge needs a hand"; do
            gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" |
              while read -r n; do
                gh issue close "$n" --comment "\`custom\` is based on $BASE now."
              done
          done

      - name: Decide whether to merge
        id: plan
        if: steps.release.outputs.latest != steps.release.outputs.base
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          title="Upstream $LATEST: merge needs a hand"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          busy=$(gh run list --workflow custom-release.yml --branch "upstream-merge/$LATEST" \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ -n "$open" ]; then
            echo "Waiting for issue #$open to be finished by hand."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [[ ! "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Personal builds are tagged custom-vX.Y.Z-krx.N, the only shape the
            # app updates from (AppRelease.h).
            gh issue create --title "$title" --body "Upstream published $LATEST, which is not vX.Y.Z. Personal builds are tagged \`custom-vX.Y.Z-krx.N\`, the only shape the app updates from (\`fincept-qt/src/services/krx_quant/AppRelease.h\`), so the automatic merge stops here. Merge it by hand with \`custom/merge-upstream-release.sh $LATEST\` and pick a tag the app can read. This issue closes itself once \`custom/UPSTREAM_BASE\` says $LATEST."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$busy" != "0" ]; then
            echo "The trial build of upstream-merge/$LATEST is still running."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # The checkout token is the one `git push` uses below. Pushing a merge
      # that brings upstream workflow changes needs SYNC_TOKEN.
      - name: Check out custom
        if: steps.plan.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the release and start the trial build
        id: merge
        if: steps.plan.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! custom/merge-upstream-release.sh "$LATEST"; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt" || true
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet "$BASE" "$LATEST" -- .github/workflows/release.yml; then
            echo "release_yml=changed" >> "$GITHUB_OUTPUT"
          fi
          branch="upstream-merge/$LATEST"
          if ! git push --force origin "HEAD:refs/heads/$branch"; then
            echo "result=push-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh workflow run custom-release.yml --ref "$branch"
          echo "result=trial" >> "$GITHUB_OUTPUT"
          echo "Pushed $branch and started its trial build."

      - name: Ask for a hand
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'push-failed'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
          RESULT: ${{ steps.merge.outputs.result }}
        run: |
          body="$RUNNER_TEMP/body.md"
          run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          if [ "$RESULT" = conflict ]; then
            {
              echo "Upstream published $LATEST (https://github.com/$UPSTREAM/releases/tag/$LATEST). Merging it into \`custom\` stopped on conflicts (run: $run_url):"
              echo
              while read -r f; do echo "- \`$f\`"; done < "$RUNNER_TEMP/conflicts.txt"
            } > "$body"
          else
            echo "Upstream published $LATEST (https://github.com/$UPSTREAM/releases/tag/$LATEST). The merge into \`custom\` is clean, but pushing it to \`upstream-merge/$LATEST\` failed (run: $run_url). Upstream changed workflow files, and pushing them needs the \`SYNC_TOKEN\` secret: a fine-grained PAT on this repository with Contents and Workflows read/write. After fixing the secret, close this issue; the next daily run, or Actions → custom-upstream-watch → Run workflow, tries again." > "$body"
          fi
          cat >> "$body" <<'EOF'

          To finish by hand on the `custom` branch:
          ```bash
          git switch custom && git pull --ff-only
          custom/merge-upstream-release.sh @LATEST@
          ```
          Resolve the conflicts as the script says, build, and check the KRX screen. Then push `custom` and tag the personal build:
          ```bash
          git push origin custom
          git tag custom-@LATEST@-krx.1 && git push origin custom-@LATEST@-krx.1
          ```
          This issue closes itself once `custom/UPSTREAM_BASE` says @LATEST@. Closing it earlier lets the daily run try the merge again.
          EOF
          text=$(cat "$body")
          printf '%s\n' "${text//@LATEST@/$LATEST}" > "$body"
          gh issue create --title "Upstream $LATEST: merge needs a hand" --body-file "$body"

      - name: Note a release.yml change
        if: steps.merge.outputs.release_yml == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
          BASE: ${{ steps.release.outputs.base }}
        run: |
          title="Upstream $LATEST changed release.yml"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "Upstream changed \`.github/workflows/release.yml\` between $BASE and $LATEST: https://github.com/$UPSTREAM/compare/$BASE...$LATEST. \`custom-release.yml\` copies its build-windows and build-macos jobs, so carry over what applies. The automatic merge does not do this; the trial build only shows that the copied jobs still build."
          fi
