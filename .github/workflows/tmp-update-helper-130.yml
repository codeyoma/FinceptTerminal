# TEMPORARY (codeyoma/krx-quant#130): exercises update-windows.ps1 against fake installs on a
# Windows runner before the real custom-release run. Removed before the PR merges.
name: tmp-update-helper-130

on:
  push:
    branches: [krx-seamless-update-130]
    paths:
      - 'fincept-qt/src/services/krx_quant/update/update-windows.ps1'
      - '.github/workflows/tmp-update-helper-130.yml'

permissions:
  contents: read

jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exercise the helper with fake installs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'fincept-qt\src\services\krx_quant\update\update-windows.ps1'
          $work = Join-Path $env:RUNNER_TEMP 'helper-test'
          New-Item -ItemType Directory $work -Force | Out-Null
          $fake = Join-Path $work 'fake.exe'
          # One program plays every part, by its own file name.
          Add-Type -OutputAssembly $fake -OutputType ConsoleApplication -TypeDefinition @'
          using System; using System.IO; using System.Threading;
          public static class Fake {
            public static int Main(string[] args) {
              string self = System.Reflection.Assembly.GetExecutingAssembly().Location;
              string dir = Path.GetDirectoryName(self);
              string name = Path.GetFileName(self).ToLowerInvariant();
              if (name == "finceptmaintenancetool.exe" && args.Length > 0 && args[0] == "purge") {
                foreach (string f in Directory.GetFiles(dir)) if (!f.Equals(self, StringComparison.OrdinalIgnoreCase)) File.Delete(f);
                foreach (string d in Directory.GetDirectories(dir)) Directory.Delete(d, true);
                return 0;
              }
              if (name.StartsWith("setup")) {
                string root = null;
                for (int i = 0; i + 1 < args.Length; i++) if (args[i] == "--root") root = args[i + 1];
                if (root == null) return 2;
                Directory.CreateDirectory(root);
                File.Copy(self, Path.Combine(root, "FinceptTerminal.exe"), true);
                File.Copy(self, Path.Combine(root, "FinceptMaintenanceTool.exe"), true);
                File.WriteAllText(Path.Combine(root, "version.txt"), "setup");
                return 0;
              }
              for (int i = 0; i + 1 < args.Length; i++)
                if (args[i] == "--sleep") { Thread.Sleep(int.Parse(args[i + 1]) * 1000); return 0; }
              File.WriteAllText(Path.Combine(dir, "launched.txt"), "yes");
              return 0;
            }
          }
          '@
          $log = Join-Path $env:TEMP 'fincept-update.log'
          function Invoke-Helper([string]$arguments) {
            $p = Start-Process -FilePath powershell.exe -Wait -PassThru -NoNewWindow -ArgumentList `
                   "-NoProfile -ExecutionPolicy Bypass -File `"$helper`" $arguments"
            Write-Host "----- log -----"; Get-Content $log -ErrorAction SilentlyContinue | Write-Host
            Remove-Item $log -ErrorAction SilentlyContinue
            return $p.ExitCode
          }
          function Assert([bool]$ok, [string]$what) { if (-not $ok) { Write-Host "::error::$what"; exit 1 } ; Write-Host "ok: $what" }
          function New-Install([string]$root, [string]$version) {
            if (Test-Path $root) { Remove-Item -Recurse -Force $root }
            New-Item -ItemType Directory "$root\sub" -Force | Out-Null
            Copy-Item $fake "$root\FinceptTerminal.exe"
            Copy-Item $fake "$root\FinceptMaintenanceTool.exe"
            Copy-Item $fake "$root\QtWebEngineProcess.exe"
            Set-Content "$root\version.txt" $version
            Set-Content "$root\sub\data.txt" $version
          }
          function New-Zip([string]$zip, [bool]$withExe) {
            $tree = "$zip.tree"
            if (Test-Path $tree) { Remove-Item -Recurse -Force $tree }
            New-Item -ItemType Directory "$tree\sub" -Force | Out-Null
            if ($withExe) { Copy-Item $fake "$tree\FinceptTerminal.exe" }
            Copy-Item $fake "$tree\QtWebEngineProcess.exe"
            Set-Content "$tree\version.txt" 'new'
            Set-Content "$tree\sub\data.txt" 'new'
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            if (Test-Path $zip) { Remove-Item $zip }
            [System.IO.Compression.ZipFile]::CreateFromDirectory($tree, $zip)
          }

          # 1. Swap: the new tree goes in, the maintenance tool and a file only the old install has stay.
          $root = Join-Path $work 'Programs\FinceptTerminal'
          New-Install $root 'old'
          Set-Content "$root\kept.txt" 'mine'
          $zip = Join-Path $work 'update.zip'; New-Zip $zip $true
          Assert ((Invoke-Helper "-Mode Swap -Zip `"$zip`" -Root `"$root`" -NoLaunch") -eq 0) 'swap exits 0'
          Assert ((Get-Content "$root\version.txt") -eq 'new') 'swap: new version.txt'
          Assert ((Get-Content "$root\sub\data.txt") -eq 'new') 'swap: new sub\data.txt'
          Assert (Test-Path "$root\FinceptMaintenanceTool.exe") 'swap: maintenance tool kept'
          Assert (Test-Path "$root\kept.txt") 'swap: old-only file kept'
          Assert (-not (Test-Path "$root.staging") -and -not (Test-Path "$root.old")) 'swap: no staging or old folder left'
          Assert (-not (Test-Path $zip)) 'swap: ZIP removed'

          # 2. The helper waits for the app and for what runs from its folder.
          New-Install $root 'old'
          New-Zip $zip $true
          $app = Start-Process -FilePath "$root\FinceptTerminal.exe" -ArgumentList '--sleep 6' -PassThru
          $web = Start-Process -FilePath "$root\QtWebEngineProcess.exe" -ArgumentList '--sleep 10' -PassThru
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Assert ((Invoke-Helper "-Mode Swap -AppPid $($app.Id) -Zip `"$zip`" -Root `"$root`" -NoLaunch") -eq 0) 'wait: exits 0'
          Assert ($clock.Elapsed.TotalSeconds -ge 9) "wait: waited for the app and its helper ($([int]$clock.Elapsed.TotalSeconds) s)"
          Assert ((Get-Content "$root\version.txt") -eq 'new') 'wait: swapped after they exited'

          # 3. A bad ZIP changes nothing.
          New-Install $root 'old'
          New-Zip $zip $false
          Assert ((Invoke-Helper "-Mode Swap -Zip `"$zip`" -Root `"$root`" -NoLaunch") -ne 0) 'bad ZIP: fails'
          Assert ((Get-Content "$root\version.txt") -eq 'old') 'bad ZIP: old install untouched'
          Assert (-not (Test-Path "$root.staging")) 'bad ZIP: no staging left'

          # 4. Restart asked: the new build opens; not asked: it does not.
          New-Install $root 'old'
          New-Zip $zip $true
          $marker = Join-Path $work 'update.zip.relaunch'; Set-Content $marker ''
          Assert ((Invoke-Helper "-Mode Swap -Zip `"$zip`" -Root `"$root`" -Relaunch `"$marker`"") -eq 0) 'relaunch: exits 0'
          for ($i = 0; $i -lt 20 -and -not (Test-Path "$root\launched.txt"); $i++) { Start-Sleep -Milliseconds 500 }
          Assert (Test-Path "$root\launched.txt") 'relaunch: the new build was opened'
          Assert (-not (Test-Path $marker)) 'relaunch: marker removed'
          New-Install $root 'old'
          New-Zip $zip $true
          Assert ((Invoke-Helper "-Mode Swap -Zip `"$zip`" -Root `"$root`" -Relaunch `"$marker`"") -eq 0) 'no restart: exits 0'
          Start-Sleep -Seconds 2
          Assert (-not (Test-Path "$root\launched.txt")) 'no restart: nothing opened'

          # 5. Move: setup.exe installs into the user folder, the old install is removed.
          $oldRoot = Join-Path $work 'ProgramFiles\FinceptTerminal'
          New-Install $oldRoot 'old'
          $userRoot = Join-Path $work 'User\Programs\FinceptTerminal'
          $setup = Join-Path $work 'setup-update.exe'; Copy-Item $fake $setup
          Assert ((Invoke-Helper "-Mode Move -Setup `"$setup`" -OldRoot `"$oldRoot`" -Root `"$userRoot`" -NoLaunch") -eq 0) 'move: exits 0'
          Assert (Test-Path "$userRoot\FinceptTerminal.exe") 'move: installed in the user folder'
          Assert ((Get-Content "$userRoot\version.txt") -eq 'setup') 'move: by the new setup.exe'
          Assert (-not (Test-Path "$oldRoot\FinceptTerminal.exe")) 'move: old install removed'
          Assert (-not (Test-Path $setup)) 'move: setup.exe removed'

          # 6. Move into a user folder that already holds something: it moves aside and goes.
          New-Install $oldRoot 'old'
          Set-Content "$userRoot\stray.txt" 'x'
          $setup = Join-Path $work 'setup-update.exe'; Copy-Item $fake $setup
          Assert ((Invoke-Helper "-Mode Move -Setup `"$setup`" -OldRoot `"$oldRoot`" -Root `"$userRoot`" -NoLaunch") -eq 0) 'move over: exits 0'
          Assert (-not (Test-Path "$userRoot\stray.txt") -and -not (Test-Path "$userRoot.old")) 'move over: the old contents are gone'
          Write-Host 'All helper checks passed.'
