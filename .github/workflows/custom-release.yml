name: Custom Release — personal Windows + macOS builds

# ─────────────────────────────────────────────────────────────────────────────
# Personal release of the codeyoma fork (see custom/README.md). Builds an
# unsigned Windows x64 IFW installer and an ad-hoc-signed macOS arm64 DMG, then
# publishes both as a prerelease on this fork. It uses no signing or
# notarization secrets, only GITHUB_TOKEN, and compiles the in-app updater out
# (-DFINCEPT_DISABLE_AUTO_UPDATE=ON) so an official release cannot replace it.
#
# Release from the custom branch:
#   git switch custom && git pull --ff-only
#   git tag custom-v4.5.0-krx.1 && git push origin custom-v4.5.0-krx.1
#
# The tagged commit must be on origin/custom, or the run stops at the first job.
# To rebuild an existing tag: Actions -> this workflow -> Run workflow, and
# enter the tag.
#
# The build, deploy and package steps are copied from release.yml's
# build-windows and build-macos jobs. When an upstream merge changes those
# jobs, carry the change over here.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'custom-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing custom-v* tag to build and release (empty = the ref this run was started from)"
        required: false
        type: string

# One run per tag. A second run for the same tag waits instead of cancelling a
# release halfway.
concurrency:
  group: custom-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  # qtserialport: the qtpositioning NMEA plugin (libqtposition_nmea) links
  # Qt6SerialPort; without it linuxdeploy/macdeployqt/windeployqt fail resolving
  # libQt6SerialPort. The app doesn't use serial GPS — this just satisfies deploy.
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport"
  QT_IFW_VERSION: "4.7"
  QT_IFW_TOOL: "tools_ifw"
  APP_NAME: FinceptTerminal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 — Stop unless the tag is a custom-v* tag on origin/custom
# ═════════════════════════════════════════════════════════════════════════════
  verify-tag:
    name: Verify tag is on custom
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on origin/custom
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^custom-v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::'${TAG}' is not a custom-v* tag. Push a custom-v* tag, or run this workflow with the tag input."
            exit 1
          fi
          git fetch --force --tags origin '+refs/heads/custom:refs/remotes/origin/custom'
          SHA="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")" || {
            echo "::error::Tag ${TAG} does not exist on origin."
            exit 1
          }
          if ! git branch -r --contains "${SHA}" | sed 's/^[* ]*//' | grep -qx 'origin/custom'; then
            echo "::error::${TAG} (${SHA}) is not on origin/custom. Tag a commit on the custom branch."
            exit 1
          fi
          echo "${TAG} -> ${SHA} is on origin/custom"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 — Windows x64 Installer (QtIFW .exe, unsigned)
# Copied from release.yml build-windows, minus the Authenticode steps.
# ═════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows x64 Installer
    needs: verify-tag
    runs-on: windows-2022
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          submodules: recursive
          fetch-depth: 1

      # ── OpenSSL (dynamic) + zlib (STATIC) dev libs ────────────────────────
      # zlib is required by find_package(ZLIB) (InstrumentDecompress.cpp).
      #
      # HISTORY (the "z.dll missing" bug): v4.1.0 shipped a Windows exe that
      # imported a DLL named "z.dll" which was never bundled, so the app died
      # on launch with "z.dll was not found". Root cause: ZLIB_ROOT was built
      # from VCPKG_INSTALLATION_ROOT, which on the runner contains BACKSLASHES
      # (e.g. C:\vcpkg). The backslash mangled the path CMake's FindZLIB
      # consumed, so the vcpkg zlib was never found and the link fell through
      # to a stray system zlib whose import name is "z.dll". The deploy step
      # only ever copied "zlib1.dll" (the wrong name) and the final gate never
      # checked it, so the broken installer shipped silently.
      #
      # FIX: (1) normalise the path to forward slashes; (2) link zlib
      # STATICALLY via the x64-windows-static-md triplet (static lib + dynamic
      # CRT, matching Qt/MSVC /MD) so there is NO runtime zlib DLL to bundle or
      # miss; (3) pass ZLIB_ROOT + ZLIB_USE_STATIC_LIBS to configure as -D
      # cache vars (authoritative — FindZLIB does a NO_DEFAULT_PATH search of
      # ZLIB_ROOT first). The "Verify dependency closure" step below is the
      # safety net that v4.1.0 lacked.
      - name: Install OpenSSL + zlib
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          VCPKG_ROOT="${VCPKG_ROOT//\\//}"   # backslashes -> forward slashes (the v4.1.0 bug)
          "$VCPKG_ROOT/vcpkg" install openssl:x64-windows zlib:x64-windows-static-md --no-print-usage
          OPENSSL_DIR="$VCPKG_ROOT/installed/x64-windows"
          ZLIB_DIR="$VCPKG_ROOT/installed/x64-windows-static-md"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_DIR" >> "$GITHUB_ENV"
          echo "ZLIB_ROOT=$ZLIB_DIR" >> "$GITHUB_ENV"
          ls "$OPENSSL_DIR/lib/libcrypto.lib" && echo "libcrypto.lib confirmed"
          # vcpkg's static-md zlib ships the archive as "zs.lib", a name stock
          # CMake FindZLIB does NOT search for (it looks for z/zlib/zlib1/...).
          # Alias it to "zlib.lib" so find_package(ZLIB) links the static
          # archive instead of falling through to a stray system zlib (the
          # v4.1.0 "z.dll" failure mode). It's a copy, so the archive is intact.
          if [ ! -f "$ZLIB_DIR/lib/zlib.lib" ]; then
            ALT="$(ls "$ZLIB_DIR"/lib/z*.lib 2>/dev/null | head -1 || true)"
            if [ -n "$ALT" ]; then cp "$ALT" "$ZLIB_DIR/lib/zlib.lib"; echo "Aliased $(basename "$ALT") -> zlib.lib"; fi
          fi
          if [ ! -f "$ZLIB_DIR/lib/zlib.lib" ]; then
            echo "::error::static zlib archive not found in $ZLIB_DIR/lib"
            ls -la "$ZLIB_DIR/lib/" 2>&1 || true
            exit 1
          fi
          echo "static zlib confirmed: $ZLIB_DIR/lib/zlib.lib"

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-windows-x64-release

      # ── Qt Installer Framework ────────────────────────────────────────────
      # Fails here, before the long build, if aqt installed a different IFW
      # version than QT_IFW_VERSION.
      - name: Install Qt Installer Framework
        shell: bash
        run: |
          pip install aqtinstall
          aqt install-tool windows desktop ${{ env.QT_IFW_TOOL }} \
            --outputdir "${{ runner.temp }}/qtifw"
          IFW_DIR="${{ runner.temp }}/qtifw/Tools/QtInstallerFramework/${{ env.QT_IFW_VERSION }}"
          if [ ! -f "${IFW_DIR}/bin/binarycreator.exe" ]; then
            echo "::error::binarycreator.exe not found under ${IFW_DIR}; installed IFW versions:"
            ls "${{ runner.temp }}/qtifw/Tools/QtInstallerFramework/" || true
            exit 1
          fi
          echo "QT_IFW_DIR=${IFW_DIR}" >> "$GITHUB_ENV"
          echo "PATH=${IFW_DIR}/bin:${PATH}" >> "$GITHUB_ENV"

      # ── Strip dangling Qt SQL driver plugin CMake configs (aqt workaround) ──
      # Same aqtinstall defect as the Linux job: Qt6Sql ships *DriverPlugin
      # CMake target files for MySQL/PSQL/ODBC/Mimer but not the plugin DLLs
      # they reference, so find_package(Qt6 ... Sql) aborts at configure time
      # ("references the file .../qsqlmysql.dll but this file does not exist").
      # We only use SQLite — drop the dangling configs before configuring.
      - name: Remove dangling Qt SQL driver plugin CMake configs
        shell: bash
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      # release.yml's flags, plus FINCEPT_RELEASE_BUILD (Qt pinned EXACT) and
      # FINCEPT_DISABLE_AUTO_UPDATE (fork rule: personal builds never update).
      - name: Configure CMake
        shell: bash
        working-directory: fincept-qt
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DZLIB_ROOT="${ZLIB_ROOT}" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DDEPLOY_QT=ON \
            -DFINCEPT_BUILD_INSTALLER=ON \
            -DFINCEPT_REQUIRE_BUNDLED_YTDLP=ON \
            -DFINCEPT_RELEASE_BUILD=ON \
            -DFINCEPT_DISABLE_AUTO_UPDATE=ON

      - name: Build
        shell: bash
        working-directory: fincept-qt
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        shell: bash
        working-directory: fincept-qt
        run: |
          BINARY="build/Release/${{ env.APP_NAME }}.exe"
          [ -f "$BINARY" ] || { echo "::error::Binary not found"; exit 1; }
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"

      # ── Deploy Qt DLLs ────────────────────────────────────────────────────
      # Mirrors the matrix build in build-cpp.yml — both must stage the SAME
      # set of DLLs, plugins, and resources or the installer ships a broken
      # app. Any addition here should also go into build-cpp.yml (and vice
      # versa). Philosophy: ship everything windeployqt might miss, even if
      # it's redundant — a 10MB larger installer is better than a crashing app.
      - name: Deploy Qt DLLs (windeployqt)
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          BUILD_DIR="build/Release"
          QT_BIN="${QT_ROOT_DIR}/bin"
          QT_PLUGINS="${QT_ROOT_DIR}/plugins"

          WDQT="${QT_BIN}/windeployqt.exe"
          [ -f "$WDQT" ] && "$WDQT" --release --no-translations --compiler-runtime \
            --include-soft-plugins --force "${BUILD_DIR}/${{ env.APP_NAME }}.exe"

          # qgeoview.dll is emitted by a FetchContent target and copied next to
          # the exe by a POST_BUILD custom_command — confirm it's present so we
          # catch the case where the custom_command silently failed.
          if [ -f "${BUILD_DIR}/qgeoview.dll" ]; then
            echo "qgeoview.dll present"
          else
            echo "::warning::qgeoview.dll missing from ${BUILD_DIR} — map widget will fail to load"
          fi

          # Qt Core DLLs — belt-and-suspenders for anything windeployqt misses.
          # The Qt6WebEngine*/Qt6Qml*/Qt6Quick* set backs the KLineChart trading
          # chart (Equity Trading / Equity Research). windeployqt is unreliable at
          # deploying the WebEngine stack, and v4.1.0 shipped WITHOUT it — opening
          # the Equity Trading tab then crashed because Chromium could not find
          # QtWebEngineProcess.exe. The runtime data files (icudtl.dat / *.pak /
          # locales) and the helper exe are copied in a dedicated block below.
          for qt_dll in \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Charts.dll Qt6PrintSupport.dll \
            Qt6Network.dll Qt6Sql.dll Qt6Concurrent.dll Qt6WebSockets.dll \
            Qt6Multimedia.dll Qt6MultimediaWidgets.dll Qt6OpenGL.dll \
            Qt6OpenGLWidgets.dll Qt6Svg.dll Qt6Xml.dll Qt6TextToSpeech.dll \
            Qt6WebEngineCore.dll Qt6WebEngineWidgets.dll Qt6WebChannel.dll \
            Qt6Quick.dll Qt6QuickWidgets.dll Qt6Qml.dll Qt6QmlMeta.dll \
            Qt6QmlModels.dll Qt6QmlWorkerScript.dll Qt6Positioning.dll; do
            [ -f "${QT_BIN}/${qt_dll}" ] && [ ! -f "${BUILD_DIR}/${qt_dll}" ] && \
              cp "${QT_BIN}/${qt_dll}" "${BUILD_DIR}/" || true
          done

          # OpenSSL — Qt6::Network needs these for HTTPS. Qt ships them in its
          # own bin/. Include the 1.1 names as a fallback for older Qt kits.
          for ssl_dll in \
            libssl-3-x64.dll libcrypto-3-x64.dll \
            libssl-3.dll     libcrypto-3.dll \
            libssl-1_1-x64.dll libcrypto-1_1-x64.dll; do
            [ -f "${QT_BIN}/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${QT_BIN}/${ssl_dll}" "${BUILD_DIR}/" || true
            [ -f "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" ] && [ ! -f "${BUILD_DIR}/${ssl_dll}" ] && \
              cp "${OPENSSL_ROOT_DIR}/bin/${ssl_dll}" "${BUILD_DIR}/" || true
          done

          # zlib — the app now links zlib STATICALLY (x64-windows-static-md), so
          # FinceptTerminal.exe has NO runtime zlib DLL dependency. This loop is
          # kept only as a fallback in case a bundled Qt/OpenSSL DLL pulls in a
          # dynamic zlib; if neither source provides one, that's expected. The
          # "Verify dependency closure" step is the real guarantee nothing is
          # missing. (ZLIB_ROOT is the static-md dir and has no bin/*.dll.)
          for zlib_dll in zlib1.dll zlibd1.dll; do
            [ -n "${ZLIB_ROOT:-}" ] && [ -f "${ZLIB_ROOT}/bin/${zlib_dll}" ] && [ ! -f "${BUILD_DIR}/${zlib_dll}" ] && \
              cp "${ZLIB_ROOT}/bin/${zlib_dll}" "${BUILD_DIR}/" || true
            [ -f "${QT_BIN}/${zlib_dll}" ] && [ ! -f "${BUILD_DIR}/${zlib_dll}" ] && \
              cp "${QT_BIN}/${zlib_dll}" "${BUILD_DIR}/" || true
          done

          # MSVC runtime — --compiler-runtime covers most but not all VS2022 17.x
          # DLLs (msvcp170, vcruntime140_2, vccorlib140 are sometimes missed).
          for vcrt_dll in \
            vcruntime140.dll vcruntime140_1.dll vcruntime140_2.dll \
            msvcp140.dll msvcp140_1.dll msvcp140_2.dll \
            msvcp170.dll \
            concrt140.dll vccorlib140.dll; do
            SYS32="/c/Windows/System32/${vcrt_dll}"
            [ -f "$SYS32" ] && [ ! -f "${BUILD_DIR}/${vcrt_dll}" ] && \
              cp "$SYS32" "${BUILD_DIR}/" || true
          done

          # Qt plugin directories — whole-dir copy so we pick up every provided
          # plugin without maintaining a per-file allowlist.
          for plugin_dir in platforms sqldrivers imageformats iconengines styles tls \
            multimedia texttospeech networkinformation platforminputcontexts printsupport generic; do
            [ -d "${QT_PLUGINS}/${plugin_dir}" ] && \
              { mkdir -p "${BUILD_DIR}/${plugin_dir}"; \
                cp -n "${QT_PLUGINS}/${plugin_dir}/"*.dll "${BUILD_DIR}/${plugin_dir}/" 2>/dev/null || true; }
          done

          # Direct3D compiler + OpenGL SW fallback — needed on VMs / headless
          # machines without a proper GPU driver. dxcompiler/dxil: Qt 6.6+ D3D12
          # backend (DXC shader compiler) — on Win11 boxes without WinSDK.
          for d3d_dll in \
            d3dcompiler_47.dll opengl32sw.dll libEGL.dll libGLESv2.dll \
            dxcompiler.dll dxil.dll; do
            [ -f "${QT_BIN}/${d3d_dll}" ] && [ ! -f "${BUILD_DIR}/${d3d_dll}" ] && \
              cp "${QT_BIN}/${d3d_dll}" "${BUILD_DIR}/" || true
          done

          # ICU — Qt 6 on Windows ships its own ICU for Unicode support.
          for icu_dll in "${QT_BIN}"/icu*.dll; do
            base=$(basename "$icu_dll")
            [ -f "$icu_dll" ] && [ ! -f "${BUILD_DIR}/${base}" ] && \
              cp "$icu_dll" "${BUILD_DIR}/" || true
          done

          cp -r resources "${BUILD_DIR}/resources" 2>/dev/null || true
          bash "${GITHUB_WORKSPACE}/.github/scripts/sync_scripts.sh" scripts "${BUILD_DIR}/scripts"

          # ── Qt WebEngine runtime (KLineChart trading chart) ──────────────────
          # MUST run AFTER the repo-resources copy above so the WebEngine .pak /
          # icudtl.dat files merge INTO the existing resources/ dir (rather than
          # the dir being created here and the repo copy nesting under it).
          # Qt resolves these relative to the exe (qt.conf Prefix=.):
          #   ./QtWebEngineProcess.exe   ./resources/*.pak + icudtl.dat
          #   ./translations/qtwebengine_locales/*.pak
          # Without them, constructing a QWebEngineView aborts the whole process
          # (this is the v4.1.0 Equity-tab crash). The dependency-closure gate
          # below only inspects DLL imports, so it cannot catch these data files —
          # the essential-files check is extended to cover them instead.
          if [ -f "${QT_BIN}/QtWebEngineProcess.exe" ]; then
            cp "${QT_BIN}/QtWebEngineProcess.exe" "${BUILD_DIR}/" || true
          else
            echo "::warning::QtWebEngineProcess.exe not found in ${QT_BIN} — WebEngine chart will be unavailable"
          fi
          # Resource paks + ICU data live in Qt's resources/ dir.
          mkdir -p "${BUILD_DIR}/resources"
          for pak in icudtl.dat qtwebengine_resources.pak qtwebengine_resources_100p.pak \
            qtwebengine_resources_200p.pak qtwebengine_devtools_resources.pak; do
            [ -f "${QT_ROOT_DIR}/resources/${pak}" ] && \
              cp "${QT_ROOT_DIR}/resources/${pak}" "${BUILD_DIR}/resources/" || true
          done
          # WebEngine locale paks (NOT covered by windeployqt --no-translations).
          if [ -d "${QT_ROOT_DIR}/translations/qtwebengine_locales" ]; then
            mkdir -p "${BUILD_DIR}/translations/qtwebengine_locales"
            cp -n "${QT_ROOT_DIR}/translations/qtwebengine_locales/"*.pak \
              "${BUILD_DIR}/translations/qtwebengine_locales/" 2>/dev/null || true
          fi

          # qt.conf — pins plugin and data paths relative to the executable.
          # Without this, Qt falls back to hardcoded build-time paths which
          # don't exist on a clean machine and cause plugin load failures.
          printf '[Paths]\nPrefix = .\nPlugins = .\nLibraries = .\n' > "${BUILD_DIR}/qt.conf"

          # Fail early if anything essential didn't make it into the stage dir.
          echo ""
          echo "=== Staged Windows payload ==="
          MISSING=0
          for essential in \
            "${{ env.APP_NAME }}.exe" \
            Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll Qt6Network.dll \
            platforms/qwindows.dll sqldrivers/qsqlite.dll \
            tls/qschannelbackend.dll; do
            if [ ! -f "${BUILD_DIR}/${essential}" ]; then
              echo "::error::Missing essential file: ${essential}"
              MISSING=1
            fi
          done

          # WebEngine runtime invariant: if we shipped the WebEngine DLL, the
          # helper exe + ICU/resource paks MUST be present too, or the Equity
          # tab crashes Chromium at view creation (the v4.1.0 regression). These
          # are data files the dependency-closure gate can't see, so check here.
          if [ -f "${BUILD_DIR}/Qt6WebEngineCore.dll" ]; then
            for we in QtWebEngineProcess.exe resources/icudtl.dat \
              resources/qtwebengine_resources.pak; do
              if [ ! -f "${BUILD_DIR}/${we}" ]; then
                echo "::error::Missing WebEngine runtime file: ${we} (Equity chart would crash)"
                MISSING=1
              fi
            done
          fi
          [ "$MISSING" -eq 1 ] && exit 1
          echo "=== $(find "${BUILD_DIR}" -type f | wc -l) files staged ==="

      # ── Dependency-closure gate ───────────────────────────────────────────
      # Walk the import table of the staged exe and, transitively, of every DLL
      # we bundle; fail the build if any imported DLL is neither bundled nor
      # provided by Windows. This is the safety net v4.1.0 lacked: that release
      # shipped an exe importing "z.dll" with no z.dll in the payload and
      # nothing caught it. A dependency is considered satisfied if it is in the
      # stage dir, is an api-ms-*/ext-ms-* virtual DLL, or exists in System32
      # (Windows ships it on every target). Anything else is a hard failure.
      #
      # NOTE: "exists in System32" trusts the runner to mirror end-user
      # machines for OS DLLs. That holds for genuine Windows components; the
      # MSVC runtime we additionally bundle ourselves. This catches the
      # missing-our-own-dependency class of bug, which is what bit v4.1.0.
      - name: Verify dependency closure
        shell: pwsh
        working-directory: fincept-qt
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path (Get-Location) 'build/Release'
          $exe = Join-Path $buildDir 'FinceptTerminal.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::Binary not found at $exe"; exit 1 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot  = & $vswhere -latest -prerelease -property installationPath | Select-Object -First 1
          $dumpbin = Get-ChildItem "$vsroot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "::error::dumpbin.exe not found under $vsroot"; exit 1 }

          $system32 = Join-Path $env:WINDIR 'System32'
          $staged   = @{}
          Get-ChildItem -Path $buildDir -Recurse -Filter *.dll | ForEach-Object { $staged[$_.Name.ToLower()] = $true }

          function Get-Deps($path) {
            $out = & $dumpbin.FullName /dependents $path 2>$null
            $deps = @()
            foreach ($line in $out) {
              $t = $line.Trim()
              if ($t -match '(?i)^[A-Za-z0-9_\-\.]+\.dll$') { $deps += $t }
            }
            return $deps
          }

          $missing = New-Object System.Collections.Generic.List[string]
          $visited = @{}
          $queue   = New-Object System.Collections.Generic.Queue[string]
          $queue.Enqueue($exe)
          $visited[(Split-Path $exe -Leaf).ToLower()] = $true

          while ($queue.Count -gt 0) {
            $cur = $queue.Dequeue()
            foreach ($dep in (Get-Deps $cur)) {
              $low = $dep.ToLower()
              if ($visited.ContainsKey($low)) { continue }
              $visited[$low] = $true
              if ($low -like 'api-ms-*' -or $low -like 'ext-ms-*') { continue }   # virtual API set
              if ($staged.ContainsKey($low)) {
                $queue.Enqueue((Join-Path $buildDir $dep)); continue              # bundled -> recurse into it
              }
              if (Test-Path (Join-Path $system32 $dep)) { continue }              # Windows-provided
              $missing.Add($dep)
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "::error::Unbundled runtime dependencies (not in payload, not in System32):"
            $missing | Sort-Object -Unique | ForEach-Object { Write-Host "::error::  missing: $_" }
            exit 1
          }
          Write-Host "Dependency closure OK - every imported DLL is bundled or provided by Windows."

      # ── Clean-machine smoke test ──────────────────────────────────────────
      # The dependency-closure gate above only inspects DLL IMPORTS. It cannot
      # see missing runtime DATA files / helper exes (QtWebEngineProcess.exe,
      # icudtl.dat, *.pak) or runtime-loaded plugins — those abort the app only
      # when a screen is actually opened, which is exactly how v4.1.0's Equity
      # tab crashed. This step launches the STAGED build with Qt/VS/vcpkg
      # stripped from PATH (so it can use ONLY its bundled runtime + System32,
      # like an end user's clean machine) and walks every screen via
      # --smoke-test. A crash or a non-constructing screen fails the release
      # before it ships. The '[Smoke] >>> constructing <id>' breadcrumbs name
      # the exact screen if it aborts the process.
      - name: Smoke-test staged build (clean PATH, all screens)
        shell: pwsh
        working-directory: fincept-qt
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path (Get-Location) 'build/Release'
          $exe = Join-Path $buildDir 'FinceptTerminal.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::exe not found at $exe"; exit 1 }

          # Strip dev toolchains from PATH so ONLY bundled DLLs + System32 resolve
          # (reproduces an end user's machine — the whole point of this gate).
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and ($_ -notmatch '(?i)\\Qt') -and ($_ -notmatch '(?i)vcpkg') -and
            ($_ -notmatch '(?i)Microsoft Visual Studio')
          }) -join ';'
          # CI runners have no real GPU — force software GL and disable the
          # Chromium GPU/sandbox so WebEngine init doesn't false-fail headless.
          $env:QT_OPENGL = 'software'
          $env:QTWEBENGINE_DISABLE_SANDBOX = '1'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu --no-sandbox --disable-gpu-compositing'

          $out = Join-Path $buildDir 'smoke_stdout.txt'
          $err = Join-Path $buildDir 'smoke_stderr.txt'
          Write-Host "Launching: FinceptTerminal.exe --smoke-test (clean PATH)"
          $p = Start-Process -FilePath $exe `
                 -ArgumentList '--smoke-test','--profile','ci-smoke' `
                 -WorkingDirectory $buildDir -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(600000)) {
            Write-Host "::error::Smoke test hung (>600s) — likely a blocking dialog or a stalled screen"
            try { $p.Kill($true) } catch {}
            Write-Host "----- stderr tail -----"
            Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "----- smoke stderr -----"
          Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 100
          $code = $p.ExitCode
          Write-Host "Smoke test exit code: $code"
          if ($code -ne 0) {
            Write-Host "::error::Smoke test failed (exit $code) — the last '[Smoke] >>> constructing <id>' line above names the screen that crashed/failed on the bundled runtime."
            exit 1
          }
          Write-Host "Smoke test passed — every screen constructed on the bundled runtime."

      # ── Headless self-tests ───────────────────────────────────────────────
      # These never ran on the release path before: the self-test loop lived
      # only in build-cpp.yml, which is workflow_dispatch-only. They are
      # deterministic, headless, and exercise the tool registry, feed parsing,
      # dock layout, F&O + paper engines, portfolio monitor/replication and
      # the arena — i.e. logic the screen-construction smoke test never
      # reaches. The flag list is discovered from the binary rather than
      # hand-copied here (it drifted once: main.cpp dispatched 10 flags while
      # CI listed 9, so --selftest-live-table ran nowhere). --profile ci keeps
      # the paper/F&O engines off any real user profile.
      - name: Run self-tests (headless)
        shell: bash
        working-directory: fincept-qt
        timeout-minutes: 25
        run: bash ../.github/scripts/ci_app_checks.sh selftests "build/Release/${{ env.APP_NAME }}.exe" ci

      # ── Generate Installer ────────────────────────────────────────────────
      # CPack names it FinceptTerminal-<version>-windows-x64-setup.exe; rename
      # it to carry the tag. The payload check below still matches the glob.
      - name: Generate Installer (CPack IFW)
        shell: bash
        working-directory: fincept-qt/build
        run: |
          set -euo pipefail
          export PATH="${QT_IFW_DIR}/bin:${PATH}"
          command -v binarycreator || { echo "::error::binarycreator not found"; exit 1; }
          cpack -G IFW -C ${{ env.BUILD_TYPE }} --verbose
          shopt -s nullglob
          SETUPS=( ${{ env.APP_NAME }}-*-windows-x64-setup.exe )
          if [ "${#SETUPS[@]}" -ne 1 ]; then
            echo "::error::expected one ${{ env.APP_NAME }}-*-windows-x64-setup.exe from cpack, found ${#SETUPS[@]}"
            ls -lh
            exit 1
          fi
          SRC="${SETUPS[0]}"
          DEST="${{ env.APP_NAME }}-${TAG}-windows-x64-setup.exe"
          [ "${SRC}" = "${DEST}" ] || mv "${SRC}" "${DEST}"
          ls -lh "${DEST}"

      # ── Validate installer PAYLOAD (not just the stage dir) ───────────────
      # The smoke test above runs against build/Release — the *staged* dir,
      # where every file exists. But CPack's install() rules decide what
      # actually lands in the installer, and a too-narrow rule (e.g. the
      # `*.dll`-only capture that shipped the v4.1.0 WebEngine crash) can drop
      # files the stage dir has. Nothing re-checked the packaged output, so the
      # regression shipped. Silently install to a temp dir and assert the
      # runtime files the app needs are actually present in what the user gets.
      - name: Verify installer payload (silent install + file tree)
        shell: pwsh
        working-directory: fincept-qt/build
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -Filter "${{ env.APP_NAME }}-*-windows-x64-setup.exe" |
                   Select-Object -First 1
          if (-not $setup) { Write-Host "::error::installer not found for payload check"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP 'fincept-payload-check'
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Write-Host "Silent-installing $($setup.Name) -> $dest"
          # IFW unattended install, matching the Qt IFW-documented form:
          #   installer --root <dir> --accept-licenses --default-answer \
          #             --confirm-command install
          # Do NOT pass --accept-messages together with --default-answer: IFW
          # rejects them as "mutually exclusive" and exits 1 before installing
          # anything. --default-answer alone answers any message query with its
          # default, which is all a clean install to an empty dir needs.
          # controlscript.qs auto-advances the wizard pages for CLI instances.
          #
          # IFW's setup.exe is a *windowed* app, so its CLI output never reaches
          # the Actions log on its own — redirect stdout/stderr to files (and add
          # --verbose) so a failure is diagnosable instead of an opaque exit 1.
          $outLog = Join-Path $env:RUNNER_TEMP 'ifw-install.out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'ifw-install.err.log'
          $p = Start-Process -FilePath $setup.FullName -PassThru -Wait `
                 -RedirectStandardOutput $outLog -RedirectStandardError $errLog `
                 -ArgumentList @(
                   '--verbose',
                   '--root', $dest,
                   '--accept-licenses',
                   '--default-answer', '--confirm-command',
                   'install' )
          Write-Host "----- installer stdout -----"
          if (Test-Path $outLog) { Get-Content $outLog | Write-Host }
          Write-Host "----- installer stderr -----"
          if (Test-Path $errLog) { Get-Content $errLog | Write-Host }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::Silent install failed (exit $($p.ExitCode)). See installer stdout/stderr above."
            exit 1
          }
          # Essential files the installed tree MUST contain. WebEngine entries
          # are conditional: only required if the WebEngine DLL was packaged.
          $missing = 0
          $required = @(
            'FinceptTerminal.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
            'qt.conf', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll'
          )
          if (Test-Path (Join-Path $dest 'Qt6WebEngineCore.dll')) {
            $required += @(
              'QtWebEngineProcess.exe',
              'resources/icudtl.dat',
              'resources/qtwebengine_resources.pak'
            )
          }
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dest $f))) {
              Write-Host "::error::Installer payload missing: $f (would crash on a clean machine)"
              $missing = 1
            }
          }
          if ($missing) {
            Write-Host "----- installed tree (top level) -----"
            Get-ChildItem $dest | Select-Object Name | Format-Table -AutoSize
            exit 1
          }
          Write-Host "Installer payload OK — all essential runtime files present in the shipped tree."

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinceptTerminal-Windows-x64-installer
          path: fincept-qt/build/FinceptTerminal-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 3 — macOS arm64 DMG (hdiutil, ad-hoc signed, not notarized)
# Copied from release.yml build-macos; Developer ID signing and notarization
# are replaced by ad-hoc signing, and the optional IFW wizard is left out.
# ═════════════════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS arm64 DMG
    needs: verify-tag
    runs-on: macos-15
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: macos-arm64-release-${{ env.QT_VERSION }}
          max-size: 500M

      - name: Install build tools
        run: brew install ninja cmake || brew upgrade ninja cmake || true

      # ── Qt ────────────────────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-macos-arm64-release

      - name: Install Python 3.12
        run: brew install python@3.12 || brew upgrade python@3.12 || true

      # ── Icon ──────────────────────────────────────────────────────────────
      - name: Generate .icns icon
        working-directory: fincept-qt
        run: |
          ICO="resources/fincept.ico"
          ICNS="resources/fincept.icns"
          if [ -f "${ICNS}" ]; then
            echo ".icns already exists"
          elif [ -f "${ICO}" ]; then
            ICONSET="$(mktemp -d)/fincept.iconset"
            mkdir -p "${ICONSET}"
            sips -s format png "${ICO}" --out "${ICONSET}/icon_512x512.png" \
              --resampleHeightWidth 512 512 2>/dev/null
            for size in 16 32 64 128 256; do
              sips -z ${size} ${size} "${ICONSET}/icon_512x512.png" \
                --out "${ICONSET}/icon_${size}x${size}.png" 2>/dev/null
            done
            cp "${ICONSET}/icon_512x512.png" "${ICONSET}/icon_256x256@2x.png"
            sips -z 1024 1024 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_512x512@2x.png" 2>/dev/null
            sips -z 64  64  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_32x32@2x.png" 2>/dev/null
            sips -z 32  32  "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_16x16@2x.png" 2>/dev/null
            sips -z 256 256 "${ICONSET}/icon_512x512.png" \
              --out "${ICONSET}/icon_128x128@2x.png" 2>/dev/null
            iconutil -c icns -o "${ICNS}" "${ICONSET}"
            echo "Generated ${ICNS}"
          else
            echo "WARNING: No source icon — app will use generic icon"
          fi

      # ── Strip dangling Qt SQL driver plugin CMake configs (aqt workaround) ──
      # Same aqtinstall defect as the Linux/Windows jobs: Qt6Sql ships
      # *DriverPlugin CMake target files for MySQL/PSQL/ODBC/Mimer but not the
      # plugin dylibs they reference, so find_package(Qt6 ... Sql) aborts at
      # configure time ("references the file .../libqsqlmysql.dylib but this
      # file does not exist"). We only use SQLite — drop the dangling configs.
      - name: Remove dangling Qt SQL driver plugin CMake configs
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure + Build ─────────────────────────────────────────────────
      # No FINCEPT_BUILD_INSTALLER on macOS — we ship a DMG built from the
      # post-processed bundle (see "Generate Installer (DMG)" step below).
      # Added to release.yml's flags: FINCEPT_RELEASE_BUILD (Qt pinned EXACT),
      # FINCEPT_DISABLE_AUTO_UPDATE (fork rule), and FINCEPT_BUILD_TESTS so the
      # Qt Test suites (including the fork's tst_krx_engine_data) build in the
      # same tree. Test executables land in build/tests/ and have no install
      # rule, so they never reach the .app or the DMG.
      - name: Configure CMake
        working-directory: fincept-qt
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFINCEPT_REQUIRE_BUNDLED_YTDLP=ON \
            -DFINCEPT_RELEASE_BUILD=ON \
            -DFINCEPT_DISABLE_AUTO_UPDATE=ON \
            -DFINCEPT_BUILD_TESTS=ON

      - name: Build
        working-directory: fincept-qt
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(sysctl -n hw.logicalcpu)

      # ── Verify ───────────────────────────────────────────────────────────
      - name: Verify binary
        working-directory: fincept-qt
        run: |
          if [ -f "build/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}"
          elif [ -f "build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          else
            echo "::error::Binary not found"
            find build -maxdepth 3 -name "${{ env.APP_NAME }}*" || true
            exit 1
          fi
          echo "Binary: $BINARY ($(du -sh "$BINARY" | cut -f1))"
          lipo -info "$BINARY"

      # ── Headless self-tests (build-tree binary) ───────────────────────────
      # Runs before staging/macdeployqt/codesign so a logic regression fails
      # in ~2 minutes rather than after the notarization round-trip. The
      # signed-bundle launch check is a separate step after stapling.
      - name: Run self-tests (headless)
        working-directory: fincept-qt
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ -f "build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" ]; then
            BINARY="build/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}"
          else
            BINARY="build/${{ env.APP_NAME }}"
          fi
          bash ../.github/scripts/ci_app_checks.sh selftests "$BINARY" ci

      # ── Unit tests (Qt Test via ctest) ────────────────────────────────────
      # Runs before packaging. The -N listing check makes sure the fork's own
      # suite is registered, so a dropped test target cannot pass silently.
      - name: Run unit tests (ctest)
        working-directory: fincept-qt
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ctest --test-dir build -N | grep -q tst_krx_engine_data || {
            echo "::error::tst_krx_engine_data is not registered with ctest"
            ctest --test-dir build -N || true
            exit 1
          }
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      # ── Stage .app bundle contents (Python + resources FIRST) ─────────────
      # Order is critical: Python.framework and resources must be in the bundle
      # BEFORE macdeployqt / codesign run. If we embed after signing, dyld on
      # macOS 14+ kills the process with SIGKILL (Code Signature Invalid)
      # because the added framework pages have no signature. See issue #139.
      - name: Stage .app bundle contents
        working-directory: fincept-qt
        run: |
          set -euxo pipefail
          BUILD_DIR="build"

          if [ -d "${BUILD_DIR}/${{ env.APP_NAME }}.app" ]; then
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
          else
            APP_BUNDLE="${BUILD_DIR}/${{ env.APP_NAME }}.app"
            mkdir -p "${APP_BUNDLE}/Contents/MacOS"
            cp "${BUILD_DIR}/${{ env.APP_NAME }}" "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            chmod +x "${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
            # Version MUST come from CMakeLists.txt, not a literal: this
            # fallback plist used to hardcode 4.3.0, so on the fallback path
            # the bundle advertised a CFBundleVersion that disagreed with the
            # binary as soon as the project version moved — which breaks the
            # auto-updater's version comparison. Note the heredoc delimiter is
            # unquoted (<<PLIST, not <<'PLIST') so ${VERSION} interpolates.
            VERSION=$(grep -Eo 'project\(FinceptTerminal VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
            [ -n "${VERSION}" ] || { echo "::error::Could not parse VERSION from CMakeLists.txt"; exit 1; }
            cat > "${APP_BUNDLE}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>FinceptTerminal</string>
            <key>CFBundleIdentifier</key><string>com.fincept.terminal</string>
            <key>CFBundleName</key><string>FinceptTerminal</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          fi

          # CMake's POST_BUILD rule copies scripts/ + resources/ + yt-dlp
          # into Contents/MacOS/ (portable layout for Linux/Windows builds).
          # On macOS that's not the canonical .app layout and codesign
          # refuses to sign any bundle with non-Mach-Os in Contents/MacOS/,
          # so the "Canonicalise bundle layout" block further down in this
          # step moves them into Contents/Resources/ before signing.
          # PythonRunner::find_scripts_dir(),
          # PythonSetupManager::find_requirements_file(), and
          # VideoPlayerWidget::resolve_ytdlp_program() each carry an
          # `../Resources/...` candidate so the C++ side picks up the new
          # location after the move.

          # Embed Python.framework before codesign so it's signed as part of
          # the bundle. We use `rsync -a` (not `ditto`) because ditto under
          # non-root breaks Versions/Current symlinks inside nested
          # Tcl.framework / Tk.framework, which then makes codesign reject the
          # bundle with "embedded framework contains modified or invalid
          # version" (issue #191). The symlink layer is rebuilt explicitly
          # below.
          # Version is pinned to match the C++ build target. Must stay in
          # sync with PythonRunner / PythonSetupManager in src/python/.
          PY_VER_KEEP="3.12"

          # Prefer the Homebrew-installed framework: on a fresh pour it holds
          # exactly Versions/${PY_VER_KEEP} + Current, avoiding the multi-
          # version mess that /Library/Frameworks/Python.framework carries on
          # the macos-15-arm64 runner image (3.11/3.12/3.13/3.14 side-by-side).
          # The extra-version pruning below is still done as a safety net.
          PY_FRAMEWORK=""
          for candidate in \
            "$(brew --prefix python@3.12 2>/dev/null)/Frameworks/Python.framework" \
            "/Library/Frameworks/Python.framework" \
            "$(brew --prefix python3 2>/dev/null)/Frameworks/Python.framework"; do
            [ -d "${candidate}/Versions" ] && { PY_FRAMEWORK="${candidate}"; break; }
          done

          BUNDLE_FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          mkdir -p "${BUNDLE_FRAMEWORKS}"

          if [ -z "${PY_FRAMEWORK}" ]; then
            echo "::warning::Python.framework not found — skipping embed step"
          else
            echo "Embedding Python.framework from: ${PY_FRAMEWORK}"
            PYFW="${BUNDLE_FRAMEWORKS}/Python.framework"
            rm -rf "${PYFW}"

            # rsync -a == -rlptgoD; -l preserves symlinks as symlinks. The
            # trailing slash on the source copies contents into the target
            # directory. --safe-links would skip symlinks that point outside
            # the source tree, which we want (dangling nested symlinks are
            # cleaned separately below).
            rsync -a "${PY_FRAMEWORK}/" "${PYFW}/"

            # Strip every Python version except the one we ship. The
            # macos-15-arm64 runner image preinstalls
            # /Library/Frameworks/Python.framework with 3.11, 3.12, 3.13 and
            # 3.14 side-by-side. Leaving more than one version inside the
            # bundled framework trips `codesign --verify --strict` with
            # "embedded framework contains modified or invalid version" —
            # Apple's framework format expects exactly one active version
            # plus Versions/Current. This must run BEFORE
            # fix_framework_symlinks, otherwise Current could point at a
            # version we are about to delete.
            if [ ! -d "${PYFW}/Versions/${PY_VER_KEEP}" ]; then
              echo "::error::Expected Python ${PY_VER_KEEP} under ${PYFW}/Versions/, found:"
              ls -la "${PYFW}/Versions/" || true
              exit 1
            fi
            for v in "${PYFW}/Versions/"*; do
              name="$(basename "$v")"
              [ "$name" = "Current" ] && continue
              [ "$name" = "${PY_VER_KEEP}" ] && continue
              [ -d "$v" ] || continue
              echo "Pruning extra Python version from bundle: ${name}"
              rm -rf "$v"
            done
            PY_VER="${PY_VER_KEEP}"
            echo "Python framework version (kept): ${PY_VER}"

            # Helper: rebuild the framework symlink layer for a framework dir.
            # $1 = path to .framework; $2 = concrete version string inside
            # Versions/. Rebuilds Versions/Current and the top-level name /
            # Resources / Headers symlinks. Uses relative targets so the
            # framework is relocatable.
            fix_framework_symlinks() {
              local fw="$1" ver="$2"
              local fw_name
              fw_name="$(basename "$fw" .framework)"
              [ -d "${fw}/Versions/${ver}" ] || { echo "skip ${fw}: Versions/${ver} missing"; return 0; }
              ( cd "${fw}/Versions" && rm -f Current && ln -s "${ver}" Current )
              for link in "${fw_name}" Resources Headers; do
                local target="Versions/Current/${link}"
                if [ -e "${fw}/${target}" ] || [ -L "${fw}/${target}" ]; then
                  ( cd "${fw}" && rm -f "${link}" && ln -s "${target}" "${link}" )
                fi
              done
            }

            # Fix Python.framework itself
            fix_framework_symlinks "${PYFW}" "${PY_VER}"

            # Fix any nested frameworks inside Python (Tcl, Tk, and anything
            # else Homebrew ships). Codesign walks into these, and a broken
            # symlink layer here is what produced the "modified or invalid
            # version" error on the runner.
            NESTED_ROOT="${PYFW}/Versions/${PY_VER}/Frameworks"
            if [ -d "${NESTED_ROOT}" ]; then
              for nested_fw in "${NESTED_ROOT}"/*.framework; do
                [ -d "${nested_fw}" ] || continue
                nested_ver=""
                if [ -d "${nested_fw}/Versions" ]; then
                  for v in "${nested_fw}/Versions/"*; do
                    name="$(basename "$v")"
                    [ "$name" = "Current" ] && continue
                    [ -d "$v" ] || continue
                    nested_ver="$name"
                    break
                  done
                fi
                [ -n "${nested_ver}" ] || { echo "skip ${nested_fw}: no version dir"; continue; }
                fix_framework_symlinks "${nested_fw}" "${nested_ver}"
              done
            fi

            # Strip dev-only files that shouldn't ship AND confuse codesign:
            #   - .pyc / .pyo caches (regenerated at runtime, stale hashes fail seal)
            #   - __pycache__ directories
            # Run AFTER the symlink fix — otherwise find could race the rebuild.
            find "${PYFW}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${PYFW}" -name "*.pyc" -delete 2>/dev/null || true
            find "${PYFW}" -name "*.pyo" -delete 2>/dev/null || true

            # Remove dangling symlinks (e.g. Homebrew's PrivateHeaders often
            # points to missing targets). `-exec test -e` resolves through
            # symlinks, so a broken link matches `! -exec test -e`.
            find "${PYFW}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true

            # Strip quarantine and extended attributes from the framework.
            # Leftover com.apple.quarantine or com.apple.provenance xattrs on
            # individual pages invalidate the ad-hoc signature when the DMG
            # is copied to /Applications on macOS 14+ Apple Silicon — this is
            # the root cause behind the SIGKILL "Code Signature Invalid"
            # reports in issues #139, #173, #191.
            xattr -cr "${PYFW}" 2>/dev/null || true

            # Convenience symlink the C++ runtime uses to invoke the embedded
            # python binary. Kept from the original block.
            ln -sf "../Frameworks/Python.framework/Versions/${PY_VER}/bin/python${PY_VER}" \
                   "${APP_BUNDLE}/Contents/MacOS/python3" 2>/dev/null || true
            echo "Python ${PY_VER} embedded"

            # Sanity-check every framework that codesign will walk into.
            # Fail fast with a clear error here rather than blowing up 30
            # seconds later inside `codesign --verify`.
            for check_fw in "${PYFW}" "${NESTED_ROOT}"/*.framework; do
              [ -d "${check_fw}" ] || continue
              if [ ! -L "${check_fw}/Versions/Current" ]; then
                echo "::error::${check_fw}/Versions/Current is not a symlink — codesign will reject"
                ls -la "${check_fw}/Versions/" || true
                exit 1
              fi
            done
            echo "Python.framework structure OK"
          fi

          # Top-level Resources/ for icons (Info.plist's CFBundleIconFile
          # is read from here).
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp -r resources "${APP_BUNDLE}/Contents/Resources/" 2>/dev/null || true

          # ── Canonicalise bundle layout for codesign ──────────────────────
          # CMake's POST_BUILD steps copy scripts/, resources/, and yt-dlp
          # into Contents/MacOS/ (alongside the binary), which is portable
          # to Linux/Windows where there's no .app bundle. On macOS that
          # layout is FATAL for codesign: anything in Contents/MacOS/ that
          # isn't a Mach-O makes codesign reject the bundle with
          #   "code object is not signed at all
          #    In subcomponent: .../Contents/MacOS/<...>"
          # So we relocate the offending paths into Contents/Resources/
          # before signing. PythonRunner / PythonSetupManager /
          # VideoPlayerWidget all have `../Resources/...` in their
          # candidate search lists, so the C++ side keeps working.
          echo "Canonicalising bundle layout (moving non-Mach-O content out of MacOS/)..."

          # scripts/ → Contents/Resources/scripts/  (preserve dir name)
          if [ -d "${APP_BUNDLE}/Contents/MacOS/scripts" ]; then
              rm -rf "${APP_BUNDLE}/Contents/Resources/scripts"
              mv "${APP_BUNDLE}/Contents/MacOS/scripts" \
                 "${APP_BUNDLE}/Contents/Resources/scripts"
              echo "  moved Contents/MacOS/scripts → Contents/Resources/scripts"
          fi

          # MacOS/resources/* → Contents/Resources/  (FLATTEN — PythonSetupManager
          # searches `../Resources/<filename>`, not `../Resources/resources/...`).
          if [ -d "${APP_BUNDLE}/Contents/MacOS/resources" ]; then
              rsync -a "${APP_BUNDLE}/Contents/MacOS/resources/" \
                       "${APP_BUNDLE}/Contents/Resources/"
              rm -rf "${APP_BUNDLE}/Contents/MacOS/resources"
              echo "  merged Contents/MacOS/resources/* → Contents/Resources/"
          fi

          # yt-dlp → Contents/Resources/yt-dlp
          if [ -f "${APP_BUNDLE}/Contents/MacOS/yt-dlp" ]; then
              mv "${APP_BUNDLE}/Contents/MacOS/yt-dlp" \
                 "${APP_BUNDLE}/Contents/Resources/yt-dlp"
              echo "  moved Contents/MacOS/yt-dlp → Contents/Resources/yt-dlp"
          fi

          echo "Bundle staged at: ${APP_BUNDLE}"
          echo "Pre-sign size: $(du -sh "${APP_BUNDLE}" | cut -f1)"
          echo "=== Contents/MacOS/ top level (should be Mach-Os only) ==="
          ls -la "${APP_BUNDLE}/Contents/MacOS/" | head -10
          echo "=== Scripts count under Contents/Resources/scripts ==="
          find "${APP_BUNDLE}/Contents/Resources/scripts" -type f 2>/dev/null | wc -l || true

      # ── Run macdeployqt on the fully staged bundle ────────────────────────
      # macdeployqt copies Qt frameworks, fixes rpaths, and signs everything
      # it touches. It must run AFTER Python.framework + resources are in place
      # so those get correct rpath treatment.
      - name: Run macdeployqt
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          MACDEPLOYQT="${QT_ROOT_DIR}/bin/macdeployqt"
          if [ -x "${MACDEPLOYQT}" ]; then
            echo "Running macdeployqt on ${APP_BUNDLE}"
            # -always-overwrite keeps incremental runs idempotent on local
            # re-runs without affecting CI (which always starts clean).
            "${MACDEPLOYQT}" "${APP_BUNDLE}" -verbose=1 -always-overwrite || \
              echo "::warning::macdeployqt exited non-zero — continuing to explicit codesign"
          else
            echo "::error::macdeployqt not found at ${MACDEPLOYQT} — bundle will be missing Qt frameworks"
            exit 1
          fi

          # Belt-and-suspenders: if any linked dylib is still pointing outside
          # the bundle (e.g. @rpath to /Users/runner/work/... or /opt/homebrew),
          # the app will crash on any other machine. Copy every non-system
          # non-bundled dylib into Frameworks/ and rewrite its install name.
          FRAMEWORKS="${APP_BUNDLE}/Contents/Frameworks"
          MAIN_BIN="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          mkdir -p "${FRAMEWORKS}"

          # Walk every Mach-O inside the bundle. For each, inspect its linked
          # libraries; if any resolve to a path that isn't a system location
          # (/usr/lib, /System) and isn't already inside the bundle, copy it
          # in and rewrite the link with install_name_tool.
          bundle_external_deps() {
            local target="$1"
            otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}' | while read -r dep; do
              case "$dep" in
                /usr/lib/*|/System/*|@executable_path/*|@loader_path/*|@rpath/*) ;;
                "") ;;
                *)
                  if [ -f "$dep" ]; then
                    base=$(basename "$dep")
                    if [ ! -f "${FRAMEWORKS}/${base}" ]; then
                      cp "$dep" "${FRAMEWORKS}/"
                      chmod u+w "${FRAMEWORKS}/${base}"
                      install_name_tool -id "@rpath/${base}" "${FRAMEWORKS}/${base}" 2>/dev/null || true
                      echo "Bundled missing dep: ${base}"
                    fi
                    install_name_tool -change "$dep" "@rpath/${base}" "$target" 2>/dev/null || true
                  fi
                  ;;
              esac
            done
          }

          # Main binary + every dylib in Frameworks
          bundle_external_deps "${MAIN_BIN}"
          find "${FRAMEWORKS}" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
            bundle_external_deps "$dylib"
          done

          # Verify no un-bundled non-system deps remain.
          LEAKS=$(otool -L "${MAIN_BIN}" 2>/dev/null | tail -n +2 | awk '{print $1}' | \
            grep -vE '^(/usr/lib|/System|@executable_path|@loader_path|@rpath)' | \
            grep -v '^$' || true)
          if [ -n "${LEAKS}" ]; then
            echo "::warning::Main binary still references external paths:"
            echo "${LEAKS}"
          else
            echo "Main binary: no external path references"
          fi

          echo "=== Bundle Frameworks/ contents ==="
          ls -la "${FRAMEWORKS}" | head -50

          # ── Thin universal Mach-Os to arm64 ─────────────────────────────────
          # jurplel/install-qt-action@v4 / aqtinstall ships Qt 6.x macOS as a
          # universal (arm64+x86_64) binary — Qt 6.2+ only publishes one macOS
          # archive labelled `clang_64` that contains both slices fused with
          # lipo. macdeployqt copies those frameworks/plugins into the bundle
          # untouched, which leaves ~36 fat Mach-Os in Contents/Frameworks/
          # and Contents/PlugIns/ while the app binary itself was built
          # arm64-only via -DCMAKE_OSX_ARCHITECTURES=arm64.
          #
          # The pre-flight architecture check below requires exactly one
          # arm64 slice per Mach-O (we ship an arm64-only DMG), so we walk
          # every Mach-O and strip x86_64 with `lipo -thin arm64`. Must run
          # BEFORE codesign — any signature applied before thinning is
          # invalidated the moment we rewrite the file.
          echo "Thinning universal Mach-Os to arm64..."
          THINNED_COUNT=0
          while IFS= read -r f; do
            file -h "$f" 2>/dev/null | grep -q "Mach-O" || continue
            # Skip if already single-arch (saves a fork+exec per file).
            ARCHS=$(file -h "$f" 2>/dev/null | grep -oE "(arm64|x86_64|i386|ppc)" | sort -u | tr '\n' ',' | sed 's/,$//')
            [ "${ARCHS}" = "arm64" ] && continue
            # Skip files with no arm64 slice at all (shouldn't happen for
            # Qt's universal build, but guard against surprises in third-
            # party dylibs that bundle_external_deps may have pulled in).
            if ! echo "${ARCHS}" | grep -q "arm64"; then
              echo "::warning::no arm64 slice in $f (archs: ${ARCHS}) — leaving as-is"
              continue
            fi
            chmod u+w "$f" 2>/dev/null || true
            if lipo -thin arm64 "$f" -output "$f" 2>/dev/null; then
              THINNED_COUNT=$((THINNED_COUNT + 1))
            else
              echo "::warning::lipo -thin arm64 failed for $f"
            fi
          done < <(find "${APP_BUNDLE}" -type f 2>/dev/null)
          echo "  thinned ${THINNED_COUNT} Mach-O(s) to arm64"

      # ── Ad-hoc codesign the bundle (no Developer ID, no notarization) ────
      # Every Mach-O on Apple Silicon needs at least an ad-hoc signature, and
      # lipo/install_name_tool above rewrote many of them. Sign leaves first
      # (release.yml's enumeration by `file -h`, which also reaches Mach-Os
      # outside the standard code folders, such as Python's lib-dynload and the
      # yt-dlp binary in Resources), then seal the bundle with build-cpp.yml's
      # deep ad-hoc signature. build-cpp.yml's --remove-signature pass is left
      # out: release.yml documents that it corrupts Qt's dylibs under newer
      # Xcode, and --force already replaces existing signatures.
      - name: Codesign bundle (ad-hoc)
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          MAIN_EXE="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"

          echo "Stripping extended attributes from bundle..."
          xattr -cr "${APP_BUNDLE}" 2>/dev/null || true

          echo "Signing every nested Mach-O ad-hoc..."
          MACHO_COUNT=0
          while IFS= read -r f; do
            [ "$f" = "${MAIN_EXE}" ] && continue
            file -h "$f" 2>/dev/null | grep -q "Mach-O" || continue
            codesign --force --sign - --timestamp=none "$f"
            MACHO_COUNT=$((MACHO_COUNT + 1))
          done < <(find "${APP_BUNDLE}" -type f 2>/dev/null)
          echo "  signed ${MACHO_COUNT} Mach-O file(s)"

          echo "Signing nested frameworks and .app bundles (deepest-first)..."
          while IFS= read -r d; do
            codesign --force --sign - --timestamp=none "$d"
          done < <(find "${APP_BUNDLE}/Contents" -mindepth 1 -depth -type d \
                        \( -name "*.framework" -o -name "*.app" \) 2>/dev/null)

          echo "Re-signing bundle ad-hoc (deep)..."
          codesign --force --deep --sign - --timestamp=none "${APP_BUNDLE}"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}" || {
            echo "::error::Bundle verification failed"
            codesign --display --deep --verbose=4 "${APP_BUNDLE}" || true
            exit 1
          }

      # ── Smoke-test the signed bundle ──────────────────────────────────────
      # Launching from inside the sealed bundle proves the ad-hoc signature
      # loads (issue #139's dyld "Code Signature Invalid" SIGKILL would abort
      # here) and walks every screen against the macdeployqt-bundled Qt.
      - name: Smoke-test signed .app bundle
        working-directory: fincept-qt
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          APP_BUNDLE="build/${{ env.APP_NAME }}.app"
          BINARY="${APP_BUNDLE}/Contents/MacOS/${{ env.APP_NAME }}"
          [ -f "${BINARY}" ] || { echo "::error::signed bundle binary not found at ${BINARY}"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"
          bash ../.github/scripts/ci_app_checks.sh smoke "${BINARY}" ci-smoke 600

      # ── Copy signed bundle to dist/ ───────────────────────────────────────
      - name: Finalize dist
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "build/${{ env.APP_NAME }}.app" "dist/"
          echo "Final bundle size: $(du -sh "dist/${{ env.APP_NAME }}.app" | cut -f1)"

      # ── Generate Installer (DMG via hdiutil, unsigned) ────────────────────
      # A plain hdiutil DMG over dist/, as release.yml does, named after the tag.
      - name: Generate Installer (DMG)
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          DMG_NAME="${{ env.APP_NAME }}-${TAG}-macos-arm64.dmg"
          echo "DMG target: ${DMG_NAME}"

          STAGING="$(mktemp -d)/dmg_staging"
          mkdir -p "${STAGING}"
          cp -R "dist/${{ env.APP_NAME }}.app" "${STAGING}/"
          # Symlink /Applications so users can drag the app across in the DMG.
          ln -s /Applications "${STAGING}/Applications"

          hdiutil create \
            -volname "${{ env.APP_NAME }}" \
            -srcfolder "${STAGING}" \
            -ov -format UDZO \
            "build/${DMG_NAME}"

          ls -lh "build/${DMG_NAME}"

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinceptTerminal-macOS-arm64-installer
          path: fincept-qt/build/FinceptTerminal-*-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 30

# ═════════════════════════════════════════════════════════════════════════════
# JOB 4 — GitHub prerelease on this fork, with GITHUB_TOKEN only
# Runs only when the tag check and both builds succeeded.
# ═════════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    needs: [verify-tag, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify-tag.outputs.tag }}
      SHA: ${{ needs.verify-tag.outputs.sha }}

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: FinceptTerminal-Windows-x64-installer
          path: dist/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: FinceptTerminal-macOS-arm64-installer
          path: dist/macos

      - name: List release assets
        run: find dist -type f | sort

      - name: Create GitHub Release and attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WIN="dist/windows/${{ env.APP_NAME }}-${TAG}-windows-x64-setup.exe"
          MAC="dist/macos/${{ env.APP_NAME }}-${TAG}-macos-arm64.dmg"
          for f in "${WIN}" "${MAC}"; do
            [ -f "$f" ] || { echo "::error::missing release asset: $f"; exit 1; }
          done

          NOTES="${RUNNER_TEMP}/notes.md"
          cat > "${NOTES}" <<'EOF'
          Personal build of the codeyoma fork of Fincept Terminal, with the KRX prediction screen added. It is not an official Fincept release.

          **Unsigned.** The Windows installer has no Authenticode signature, and the macOS app is only ad-hoc signed and not notarized, so both systems warn on first launch. The in-app updater is turned off in this build.

          | Platform | File |
          |---|---|
          | Windows x64 | `FinceptTerminal-@TAG@-windows-x64-setup.exe` |
          | macOS Apple Silicon (13+) | `FinceptTerminal-@TAG@-macos-arm64.dmg` |

          ### How to open it

          **macOS:** open the DMG and drag FinceptTerminal to Applications. Then right-click the app → Open, and confirm Open. If macOS still refuses (macOS 15 and later no longer offer Open there), go to System Settings → Privacy & Security and click Open Anyway, or clear the quarantine flag in Terminal:

              xattr -dr com.apple.quarantine /Applications/FinceptTerminal.app

          **Windows:** run the installer. When SmartScreen shows "Windows protected your PC", click More info → Run anyway.

          Built from @SHA@ on the `custom` branch.
          EOF
          sed -i "s/@TAG@/${TAG}/g; s/@SHA@/${SHA}/g" "${NOTES}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; replacing its assets."
            gh release upload "${TAG}" "${WIN}" "${MAC}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${WIN}" "${MAC}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --prerelease \
              --title "Fincept Terminal ${TAG} (personal build)" \
              --notes-file "${NOTES}"
          fi
