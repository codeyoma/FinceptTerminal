<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The KRX screen's chart (fork addition, codeyoma/krx-quant#105–#110, #159, #167, #182, #185,
  #221, #222, #223, #224, #225, #236), drawn with TradingView Lightweight Charts (NOTICE). It only draws
  what the screen sends over the web channel: the bars in the style chosen (or the bricks of a style
  without a time axis, a slot each, named by when each ended), a minute view's empty bars (a slot
  without trades between two bars of a day: whitespace, no candle and no volume, #236) and the
  special situations' bands over every pane with their names (#236), the days' first bars filled,
  the consensus icons, each bar's hover box and its four-minute window with two levels across it
  (the touch targets, the range's highest and lowest mid-points, or the barrier's U and L), the
  indicators (their lines, the fills between two, the fractals' marks, the volume profile's bars,
  the anchored VWAP's marker; below the prices a pane per lower indicator, the volume's among
  them, with its guide lines) with each pane's legend, the theme, and when to fit. Many panes
  make the chart taller than the page, which then scrolls. It tells the screen where its view
  is, the legend's buttons, the anchored VWAP's bar clicked or dragged to, and the lower panes'
  heights once a border between panes is dragged. Over the prices it draws the symbol's drawings
  (#224) and lets them be placed with the tool the screen chose, picked, dragged, removed (Delete,
  Backspace) and double-clicked; it tells the screen each, in bar positions. At the bottom right,
  where the time axis meets the price axis, 일반 and 로그 choose the price pane's scale (#245); it
  tells the screen the one clicked.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080808; }
  /* The chart grows taller than the page when its lower panes need it (krx-quant #223): it scrolls. */
  #scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; }
  #scroller::-webkit-scrollbar { width: 8px; }
  #scroller::-webkit-scrollbar-track { background: transparent; }
  #scroller::-webkit-scrollbar-thumb { background: var(--thumb, #333); border-radius: 4px; }
  #stage { position: relative; width: 100%; height: 100%; }
  #chart, #links { position: absolute; inset: 0; }
  #links { pointer-events: none; z-index: 60; width: 100%; height: 100%; } /* above the chart's own canvases (z-index up to 50) */
  #tip {
    position: absolute; display: none; pointer-events: none; white-space: pre-wrap;
    padding: 4px 8px; border: 1px solid; z-index: 61;
    max-width: calc(100% - 30px); box-sizing: border-box; /* a long line wraps inside the chart */
  }
  /* Each pane's legend (krx-quant #222): top left, a row per indicator; hovered, its buttons. */
  .legend { position: absolute; left: 4px; z-index: 62; pointer-events: none; max-width: calc(100% - 80px); }
  .legend .row {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; white-space: nowrap;
    padding: 0 4px; border-radius: 2px; line-height: 1.55; width: max-content; max-width: 100%;
  }
  .legend .row.hover { background: var(--hover); }
  .legend .name { font-weight: 700; }
  .legend .settings { opacity: 0.7; }
  .legend .row.hidden .name, .legend .row.hidden .settings { opacity: 0.4; }
  .legend .note { color: var(--note); }
  .legend .tools { display: none; gap: 1px; align-items: center; }
  .legend .row.hover .tools { display: inline-flex; }
  .legend .tools span { display: inline-flex; padding: 1px 2px; cursor: pointer; border-radius: 2px; opacity: 0.8; }
  .legend .tools span:hover { opacity: 1; background: var(--hover); }
  .legend svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.4; }
  /* The price pane's scale (krx-quant #245): bottom right, in the time axis's row up to the right
     edge, below its border line. The one chosen in the accent. */
  #scale {
    position: absolute; right: 0; bottom: 0; z-index: 62; display: flex; align-items: center; gap: 1px;
    padding: 0 3px; box-sizing: border-box; user-select: none; background: var(--background);
  }
  #scale span { padding: 0 4px; border-radius: 2px; cursor: pointer; opacity: 0.75; line-height: 1.4; }
  #scale span:hover { opacity: 1; background: var(--hover); }
  #scale span.on { opacity: 1; color: var(--on); font-weight: 700; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="scroller"><div id="stage">
<div id="chart"></div>
<canvas id="links"></canvas>
<div id="tip"></div>
<div id="scale"><span data-log="0" title="가격 축을 일반 눈금으로 본다">일반</span><span data-log="1"
  title="가격 축을 로그 눈금으로 본다: 같은 비율의 움직임이 같은 높이다">로그</span></div>
</div></div>
<script>
(function () {
  const L = LightweightCharts;
  const area = document.getElementById('chart');
  const links = document.getElementById('links');
  const tip = document.getElementById('tip');
  const scroller = document.getElementById('scroller');
  const stage = document.getElementById('stage');
  // Each pane's legend box, top down (krx-quant #222, #223): made as panes come.
  const legendBoxes = [];
  function legendBox(i) {
    while (legendBoxes.length <= i) {
      const box = document.createElement('div');
      box.className = 'legend';
      box.id = 'legend' + legendBoxes.length;
      stage.appendChild(box);
      legendBoxes.push(box);
      styleLegend(box);
    }
    return legendBoxes[i];
  }
  const chart = L.createChart(area, {
    autoSize: true,
    layout: { attributionLogo: false }, // the attribution is on the panel title and in the README
    // The latest target's slot shows on the right; on the left the view stops at the first bar
    // read, where the bars before are read (krx-quant #108).
    timeScale: {
      timeVisible: true, secondsVisible: false, rightOffset: 6, fixLeftEdge: true,
      // Bricks (krx-quant #225) are on slots: their marks are named by when each brick ended.
      tickMarkFormatter: function (time) { return bricks ? brickLabel(time) : null; },
    },
  });
  let colors = {
    tip_background: '#111', tip_border: '#333', tip_text: '#e5e5e5', link: '#f59e0b', up: '#16a34a', down: '#dc2626',
    band: 'rgba(128,128,128,0.22)', text: '#999',
  };

  // ``color`` (rgba(r,g,b,a) from the screen) at ``alpha``.
  function fade(color, alpha) {
    const m = /rgba?\(([^)]+)\)/.exec(color);
    return m ? 'rgba(' + m[1].split(',').slice(0, 3).join(',') + ',' + alpha + ')' : color;
  }

  // The days' first bars of a minute view, filled grey behind the bars (krx-quant #221): a band a
  // bar wide, the pane's height, in each pane it is attached to.
  let bandTimes = [];
  function bandPrimitive() {
    const renderer = {
      draw(target) {
        if (!bandTimes.length) return;
        target.useBitmapCoordinateSpace(function (scope) {
          const scale = chart.timeScale();
          const a = scale.logicalToCoordinate(0), b = scale.logicalToCoordinate(1);
          if (a === null || b === null) return;
          const half = (b - a) / 2;
          const g = scope.context;
          g.fillStyle = colors.band;
          for (const time of bandTimes) {
            const x = scale.timeToCoordinate(time);
            if (x === null) continue;
            const left = Math.round((x - half) * scope.horizontalPixelRatio);
            const right = Math.round((x + half) * scope.horizontalPixelRatio);
            g.fillRect(left, 0, Math.max(1, right - left), scope.bitmapSize.height);
          }
        });
      },
    };
    const view = { zOrder: () => 'bottom', renderer: () => renderer };
    return { paneViews: () => [view], updateAllViews() {} };
  }

  // The special situations (krx-quant #236): each VI, circuit breaker or sidecar a faint band from
  // where it started to where it ended (bar positions on the bars drawn, the empty bars' slots among
  // them), the whole height of each pane it is attached to, behind the bars; ``labelled`` (the price
  // pane) writes its name at the top, below the legend where they would meet. As the screen sends
  // them: [{from, to, label, fill, color}].
  let specialBands = [];
  function specialPrimitive(labelled) {
    const renderer = {
      draw(target) {
        if (!specialBands.length) return;
        target.useMediaCoordinateSpace(function (scope) {
          const g = scope.context;
          const size = scope.mediaSize;
          const px = Math.max(9, (colors.size || 11) - 1);
          const legend = legendBoxes.length ? legendBoxes[0] : null;
          const legendRight = legend && legend.childElementCount ? legend.offsetLeft + legend.offsetWidth : 0;
          const legendFoot = legend ? legend.offsetTop + legend.offsetHeight : 0;
          for (const band of specialBands) {
            const a = logicalX(band.from), b = logicalX(band.to);
            if (a === null || b === null || b < 0 || a > size.width) continue;
            g.fillStyle = band.fill;
            g.fillRect(a, 0, Math.max(1, b - a), size.height);
            if (!labelled) continue;
            const x = Math.max(a, 0) + 3;
            g.font = fontOf(px, true);
            g.fillStyle = band.color;
            g.textAlign = 'left';
            g.textBaseline = 'top';
            g.fillText(band.label, x, x < legendRight + 6 ? legendFoot + 4 : 4);
          }
        });
      },
    };
    const view = { zOrder: () => 'bottom', renderer: () => renderer };
    return { paneViews: () => [view], updateAllViews() {} };
  }

  // A layer drawn in the price pane in its own coordinates (krx-quant #222): the fills between two
  // indicator lines, the volume profile, the anchored VWAP's marker.
  let redrawPrices = null; // asks the price pane to draw again (a layer's data changed)
  function layer(zOrder, draw) {
    const renderer = {
      draw(target) {
        target.useMediaCoordinateSpace(function (scope) { draw(scope.context, scope.mediaSize); });
      },
    };
    const view = { zOrder: () => zOrder, renderer: () => renderer };
    return {
      paneViews: () => [view],
      updateAllViews() {},
      attached(param) { redrawPrices = param.requestUpdate; },
    };
  }
  function repaint() { if (redrawPrices) redrawPrices(); }

  // The styles without a time axis (krx-quant #225): bricks drawn in order, a slot each. Their
  // size, and when each ended by slot: {size, ends: Map(slot -> chart time)}; null for bars.
  const TIMELESS = new Set(['renko', 'kagi', 'point_figure', 'line_break']);
  let bricks = null;
  function brickLabel(slot) {
    const end = bricks ? bricks.ends.get(slot) : undefined;
    return end === undefined ? '' : timeText(end);
  }

  // A kagi's lines and a point and figure's columns (krx-quant #225), drawn by hand as a custom
  // series: each brick on its slot ({open, high, low, close}; a kagi line also thick at its start and
  // where it turns), its prices for the scale. A kagi line is thick (yang) in the rising colour, thin
  // (yin) in the falling one, joined to the line before at its end; a column is X boxes rising, O
  // falling, a box a mark at each multiple of the size from its low to its high.
  function brickSeries(kind) {
    let data = null;
    let options = null;
    function kagi(g, from, to, priceToY, h, v) {
      const fat = Math.max(1, Math.round(3 * h)), lean = Math.max(1, Math.round(h));
      g.lineCap = 'square';
      const stroke = function (x1, y1, x2, y2, thick) {
        g.strokeStyle = thick ? options.upColor : options.downColor;
        g.lineWidth = thick ? fat : lean;
        g.beginPath();
        g.moveTo(x1, y1 * v);
        g.lineTo(x2, y2 * v);
        g.stroke();
      };
      for (let i = from; i < to; ++i) {
        const d = data.bars[i].originalData, x = Math.round(data.bars[i].x * h);
        const top = priceToY(d.open), end = priceToY(d.close);
        if (top === null || end === null) continue;
        if (i > 0) stroke(Math.round(data.bars[i - 1].x * h), top, x, top, d.thick); // its shoulder or waist
        const turn = d.turn === undefined ? null : priceToY(d.turn);
        if (turn === null) {
          stroke(x, top, x, end, d.thick);
        } else {
          stroke(x, top, x, turn, d.thick);
          stroke(x, turn, x, end, !d.thick);
        }
      }
    }
    function figure(g, from, to, priceToY, h, v) {
      const box = bricks ? bricks.size : 0;
      if (!(box > 0)) return;
      const half = Math.max(1, data.barSpacing * 0.36) * h; // a mark's half width
      g.lineWidth = Math.max(1, Math.round(1.3 * h));
      for (let i = from; i < to; ++i) {
        const d = data.bars[i].originalData, x = data.bars[i].x * h;
        const rising = d.close > d.open;
        const color = rising ? options.upColor : options.downColor;
        const a = priceToY(d.low - box / 2), b = priceToY(d.low + box / 2);
        if (a === null || b === null) continue;
        const cell = Math.abs(a - b) * v; // a box's height
        const count = Math.round((d.high - d.low) / box) + 1;
        if (cell < 4 || count > 2000) { // too small for marks: the column filled
          const top = priceToY(d.high + box / 2);
          if (top === null) continue;
          g.fillStyle = fade(color, 0.6);
          g.fillRect(x - half, top * v, 2 * half, a * v - top * v);
          continue;
        }
        const rx = Math.min(half, cell * 0.42), ry = cell * 0.38;
        g.strokeStyle = color;
        for (let k = 0; k < count; ++k) {
          const y = priceToY(d.low + k * box);
          if (y === null) continue;
          const cy = y * v;
          g.beginPath();
          if (rising) {
            g.moveTo(x - rx, cy - ry);
            g.lineTo(x + rx, cy + ry);
            g.moveTo(x - rx, cy + ry);
            g.lineTo(x + rx, cy - ry);
          } else {
            g.ellipse(x, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, 2 * Math.PI);
          }
          g.stroke();
        }
      }
    }
    const renderer = {
      draw(target, priceToY) {
        if (!data || !data.bars.length || !data.visibleRange || !options) return;
        target.useBitmapCoordinateSpace(function (scope) {
          const from = Math.max(0, data.visibleRange.from - 1);
          const to = Math.min(data.bars.length, data.visibleRange.to + 1);
          const draw = kind === 'kagi' ? kagi : figure;
          draw(scope.context, from, to, priceToY, scope.horizontalPixelRatio, scope.verticalPixelRatio);
        });
      },
    };
    return {
      renderer: () => renderer,
      update(d, o) { data = d; options = o; },
      // A column's marks reach half a box past its first and last.
      priceValueBuilder(item) {
        const pad = kind === 'point_figure' && bricks ? bricks.size / 2 : 0;
        return [item.high + pad, item.low - pad, item.close];
      },
      isWhitespace: (item) => item.close === undefined,
      defaultOptions: () => ({ upColor: colors.up, downColor: colors.down }),
    };
  }

  // The price series in the style chosen (krx-quant #221): its kind of series and options. A
  // line, an area and a baseline draw the closes. Renko and line break bricks are candles without
  // wicks, kagi and point and figure a custom series (krx-quant #225).
  let style = null;
  let baseValue = 0; // the baseline's base
  function styleOptions(kind) {
    // A Heikin-Ashi chart's price line is the last bar's own close (realLine), not its own; so is
    // that of bricks.
    const real = kind === 'heikin_ashi' || TIMELESS.has(kind);
    const options = {
      priceLineVisible: !real,
      lastValueVisible: !real,
      priceFormat: { type: 'price', precision: 0, minMove: 1 }, // won, as KRX stocks trade
    };
    const candle = {
      upColor: colors.up, downColor: colors.down, borderUpColor: colors.up, borderDownColor: colors.down,
      wickUpColor: colors.up, wickDownColor: colors.down,
    };
    switch (kind) {
      case 'bar':
        return [L.BarSeries, Object.assign(options, { upColor: colors.up, downColor: colors.down, thinBars: false })];
      case 'line':
        return [L.LineSeries, Object.assign(options, { color: colors.link, lineWidth: 2 })];
      case 'area':
        return [L.AreaSeries, Object.assign(options, {
          lineColor: colors.link, topColor: fade(colors.link, 0.35), bottomColor: fade(colors.link, 0.02), lineWidth: 2,
        })];
      case 'baseline':
        return [L.BaselineSeries, Object.assign(options, {
          baseValue: { type: 'price', price: baseValue }, lineWidth: 2,
          topLineColor: colors.up, topFillColor1: fade(colors.up, 0.28), topFillColor2: fade(colors.up, 0.05),
          bottomLineColor: colors.down, bottomFillColor1: fade(colors.down, 0.05), bottomFillColor2: fade(colors.down, 0.28),
        })];
      case 'hollow': // rising bars as outlines, falling ones filled
        return [L.CandlestickSeries, Object.assign(options, candle, { upColor: 'rgba(0,0,0,0)' })];
      case 'renko':
      case 'line_break': // boxes from where each starts to where it ends
        return [L.CandlestickSeries, Object.assign(options, candle, { wickVisible: false })];
      case 'kagi':
      case 'point_figure':
        return [null, Object.assign(options, { upColor: colors.up, downColor: colors.down }), brickSeries(kind)];
      default: // candles and Heikin-Ashi bars
        return [L.CandlestickSeries, Object.assign(options, candle)];
    }
  }
  function point(b) {
    if (b.close === undefined) return { time: b.time }; // an empty bar (krx-quant #236): its slot alone
    return style === 'line' || style === 'area' || style === 'baseline' ? { time: b.time, value: b.close } : b;
  }

  let main = null;  // the price series
  let icons = null; // its markers: the consensus icons and the fractals
  let iconMarks = []; // the consensus icons as markers
  let studyMarks = []; // the fractals as markers (krx-quant #222)
  // The indicators (krx-quant #222, #223): a series each, in the price pane or a lower one, kept by
  // id while the screen sends them again; the fills, the fractals, the volume profile and the
  // anchor are layers. id -> {series, pane (a lower pane; null: the prices'), histogram, decimals,
  // up, down, guides: [price lines], times: [time…], values: Map(time -> value)}
  const lines = new Map();
  let fills = [];
  let profile = null;  // {color, rows: [{low, high, volume}]}
  let anchor = null;   // {time, color}
  let dragTime = null; // the bar the anchor's marker is dragged to
  let picking = false; // the next click on the chart anchors the anchored VWAP
  let legendRows = []; // as sent
  let realLine = null; // a Heikin-Ashi chart's line at the last bar's own close
  // The drawings (krx-quant #224, below): declared before the price series is made with their layer.
  const FIB = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
  const FAN = [0.25, 0.382, 0.5, 0.618, 0.75];
  const TEXT_SIZES = [12, 14, 17, 20]; // a text's width 1–4 is its size
  let drawings = [];
  let drawingsHidden = false; // a style without a time axis (krx-quant #225)
  let magnet = false;
  let realBars = null;        // a Heikin-Ashi chart's bars as they are, [open, high, low, close]: the magnet's
  let dated = false;          // a candle view: the time axis shows dates
  let selectedId = 0;
  let tool = null;            // the tool chosen: {tool, points (how many), color, width, style, text}
  let placed = [];            // its points placed so far, [logical, price]
  let follow = null;          // where its next point would go: under the pointer
  let downAt = null;          // where the button last went down while placing, [x, y]
  let grab = null;            // a drawing being dragged: {id, grip, start, from, drawing, moved, at}
  const measure = document.createElement('canvas').getContext('2d');
  function makeMain(kind) {
    style = kind;
    const [type, options, custom] = styleOptions(kind);
    // Made before the old one goes, so the price pane is never empty (an empty pane is removed).
    const made = custom ? chart.addCustomSeries(custom, options, 0) : chart.addSeries(type, options, 0);
    if (main) {
      icons.detach();
      chart.removeSeries(main);
    }
    main = made;
    realLine = null;
    icons = L.createSeriesMarkers(main, []);
    main.attachPrimitive(bandPrimitive());
    main.attachPrimitive(specialPrimitive(true)); // the special situations (krx-quant #236), named
    main.attachPrimitive(layer('bottom', drawFills));
    main.attachPrimitive(layer('bottom', drawProfile));
    main.attachPrimitive(layer('top', drawAnchor));
    main.attachPrimitive(drawingPrimitive()); // the drawings (krx-quant #224), over all of them
    main.attachPrimitive(brickAxis()); // the crosshair's time on bricks (krx-quant #225)
    showMarks();
  }
  // The crosshair's label on the time axis over bricks (krx-quant #225): when the brick under it
  // ended (the chart's own label is off there: it would name the slot).
  let crossSlot = null;
  function brickAxis() {
    return {
      paneViews: () => [],
      timeAxisViews: function () {
        if (!bricks || crossSlot === null) return [];
        const x = chart.timeScale().timeToCoordinate(crossSlot);
        const text = brickLabel(crossSlot);
        if (x === null || !text) return [];
        return [{
          coordinate: () => x, text: () => text, textColor: () => colors.tip_text || '#e5e5e5',
          backColor: () => colors.label || '#333',
        }];
      },
      updateAllViews() {},
    };
  }
  function showReal(last) {
    if ((style !== 'heikin_ashi' && !TIMELESS.has(style)) || !last) {
      if (realLine) main.removePriceLine(realLine);
      realLine = null;
      return;
    }
    const options = {
      price: last.close, color: last.rising ? colors.up : colors.down, lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
    };
    if (realLine) realLine.applyOptions(options); else realLine = main.createPriceLine(options);
  }

  // The panes below the prices (krx-quant #223), top down: a lower indicator's each, in the order
  // it was turned on, as the screen sends them. Each {key, api, height (CSS pixels), hidden,
  // guides}. A hidden one stays, empty. Their heights are kept: the price pane takes the rest, at
  // least its least height; past that the chart grows taller than the page, which scrolls.
  let lowerPanes = [];
  let sizes = { min_price: 200, pane_min: 40, pane_max: 1000 };
  function arrangePanes(sent) {
    const want = sent.map((p) => p.key);
    const same = want.length === lowerPanes.length && want.every((key, i) => lowerPanes[i].key === key);
    if (!same) {
      // Those kept stay when they come first in the same order (one turned off, or new ones
      // turned on after them, as usual); otherwise (another symbol's) all are made again.
      const kept = lowerPanes.filter((p) => want.includes(p.key));
      const stay = kept.every((p, i) => want[i] === p.key);
      for (const pane of lowerPanes) {
        if (stay && want.includes(pane.key)) continue;
        dropPaneSeries(pane);
        chart.removePane(pane.api.paneIndex());
      }
      const staying = new Map(stay ? kept.map((p) => [p.key, p]) : []);
      lowerPanes = want.map((key) => staying.get(key) || makePane(key)); // new ones at the bottom, in order
    }
    sent.forEach(function (s, i) {
      Object.assign(lowerPanes[i], { height: s.height, hidden: !!s.hidden, guides: s.guides || [] });
    });
    showVolume();
    layoutPanes();
  }
  function makePane(key) {
    const api = chart.addPane(true); // kept while it has no series: a hidden indicator's
    api.attachPrimitive(bandPrimitive()); // the days' first bars, its whole height
    api.attachPrimitive(specialPrimitive(false)); // the special situations (krx-quant #236)
    return { key: key, api: api, height: 100, hidden: false, guides: [] };
  }
  function dropPaneSeries(pane) {
    for (const [id, entry] of lines) {
      if (entry.pane !== pane) continue;
      chart.removeSeries(entry.series);
      lines.delete(id);
    }
    if (pane.key === 'volume' && volumes) {
      chart.removeSeries(volumes);
      volumes = null;
    }
  }
  function layoutPanes() {
    const borders = lowerPanes.length; // a pixel each
    const axis = chart.timeScale().height();
    const lower = lowerPanes.reduce((sum, p) => sum + p.height, 0);
    const total = Math.max(scroller.clientHeight, sizes.min_price + lower + borders + axis);
    stage.style.height = total + 'px';
    chart.panes()[0].setStretchFactor(Math.max(1, total - axis - borders - lower));
    for (const pane of lowerPanes) pane.api.setStretchFactor(pane.height);
    placeLegend();
  }
  // A border between panes dragged: the lower panes' heights now, kept for the symbol. The
  // chart's own drag sets them; the price pane keeps its least height after it.
  let resizing = false;
  window.addEventListener('mousedown', function (e) {
    resizing = !!(e.target && e.target.style && e.target.style.cursor === 'row-resize'); // a border's handle
  }, true);
  window.addEventListener('mouseup', function () {
    if (!resizing) return;
    resizing = false;
    setTimeout(panesDragged, 0); // after the chart's own handler
  }, true);
  function panesDragged() {
    const heights = {};
    let moved = false;
    for (const pane of lowerPanes) {
      const height = Math.max(sizes.pane_min, Math.min(sizes.pane_max, Math.round(pane.api.getHeight())));
      if (Math.abs(height - pane.height) > 1) moved = true;
      heights[pane.key] = height;
    }
    if (!moved) return;
    for (const pane of lowerPanes) pane.height = heights[pane.key];
    layoutPanes();
    if (bridge) bridge.panes(JSON.stringify(heights));
  }

  // The volumes, in their pane while the volume is on (krx-quant #222, #223); hidden, not drawn.
  let volumes = null;
  let volumeData = [];
  let volumeAt = new Map(); // time -> volume, for the legend
  function showVolume() {
    const pane = lowerPanes.find((p) => p.key === 'volume');
    if (!pane) {
      if (volumes) chart.removeSeries(volumes);
      volumes = null;
      return;
    }
    if (!volumes) {
      volumes = pane.api.addSeries(L.HistogramSeries, {
        priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false,
      });
      volumes.setData(volumeData);
    }
    volumes.applyOptions({ visible: !pane.hidden });
  }
  makeMain('candle');

  // The view follows the latest bars: from the first bars drawn, and again after a fit (the
  // button, a double click, another view), until it is moved by hand. While it follows, each
  // change of the bars fits them again. The first bars drawn are often today's alone, those
  // before them (the indicators' history, krx-quant #222, #223) right after: fitted once, the
  // view kept the first few bars' zoom, or, as the chart applies a range at its next frame by
  // its indexes then, landed on the days read before them.
  let fitRange = null;
  let following = true;
  let fittedTo = ''; // the bars and fit last asked for while following
  function fit() {
    following = true;
    fittedTo = '';
    refit();
  }
  function refit() {
    if (!following || !fitRange || !bars.length) return;
    const asked = [bars.length, bars[0].time, fitRange.from, fitRange.to].join();
    if (asked === fittedTo) return;
    fittedTo = asked;
    chart.timeScale().setVisibleLogicalRange(fitRange);
  }
  // Resized while it follows (the page laying itself out after the first bars, the window
  // made larger): fitted again, as the chart keeps its bars' width.
  let fittedWidth = 0;
  new ResizeObserver(function () {
    if (area.clientWidth === fittedWidth) return;
    fittedWidth = area.clientWidth;
    fittedTo = '';
    refit();
  }).observe(area);
  // Moved by hand: a wheel, a drag or a touch on the chart (a click too). The view then stays
  // where it is as bars come in, until the next fit.
  for (const type of ['wheel', 'mousedown', 'touchstart']) {
    window.addEventListener(type, function (e) {
      if (area.contains(e.target)) following = false;
    }, { capture: true, passive: true });
  }
  // Shift and the wheel move the view sideways (krx-quant #242). The chart scrolls on a sideways
  // wheel (deltaX) and zooms on an upright one (deltaY). macOS sends Shift and the wheel sideways
  // already; Windows sends it upright with Shift held, so it is handed on sideways here.
  window.addEventListener('wheel', function (e) {
    if (!e.shiftKey || e.deltaX !== 0 || e.deltaY === 0 || !area.contains(e.target)) return;
    e.stopImmediatePropagation();
    e.preventDefault();
    e.target.dispatchEvent(new WheelEvent('wheel', {
      deltaX: e.deltaY, deltaY: 0, deltaMode: e.deltaMode, shiftKey: true,
      clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
      bubbles: true, cancelable: true, composed: true, view: window,
    }));
  }, { capture: true, passive: false });

  let bars = [];        // as drawn, oldest first
  let barAt = new Map(); // time -> index in bars
  let iconAt = new Map(); // time -> icon
  let hoverAt = new Map(); // time -> hover box (krx-quant #159)
  let hovered = null;      // the bar hovered: {time, x}, kept while the data is sent again
  function showMarks() {
    const all = iconMarks.concat(studyMarks);
    all.sort((a, b) => a.time - b.time);
    icons.setMarkers(all);
  }

  function show(data) {
    // Day candles (krx-quant #111) are dated: the axis and the crosshair show no time. Bricks
    // (krx-quant #225) name their slots by when each ended, the crosshair's too (brickAxis).
    bricks = data.bricks ? { size: data.bricks.size, ends: new Map() } : null;
    if (bricks) data.bars.forEach((b, i) => bricks.ends.set(b.time, data.bricks.ends[i]));
    chart.applyOptions({
      // A brick's time ("10-12 09:31", "2026-10-12") is longer than the chart's own marks: spaced for it.
      timeScale: { timeVisible: !data.day, tickMarkMaxCharacterLength: bricks ? 11 : 8 },
      crosshair: { vertLine: { labelVisible: !bricks } },
    });
    dated = !!data.day;
    const firstBefore = bars.length ? bars[0].time : null;
    if (data.style !== style) makeMain(data.style);
    if (data.base !== undefined) {
      baseValue = data.base;
      if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
    }
    bandTimes = data.bands;
    bars = data.bars;
    barAt = new Map(bars.map((b, i) => [b.time, i]));
    realBars = data.real || null;
    rebaseDrawing(firstBefore); // a drawing being placed or dragged stays on its bars (krx-quant #224)
    showDrawings(data.drawings);
    iconAt = new Map(data.icons.map((i) => [String(i.time), i]));
    main.setData(bars.map(point));
    volumeData = data.volumes;
    // An empty bar's volume (krx-quant #236) is 0 in the legend; its pane draws none.
    volumeAt = new Map(volumeData.map((v) => [v.time, v.value === undefined ? 0 : v.value]));
    specialBands = data.special || [];
    if (volumes) volumes.setData(volumeData);
    showReal(data.last);
    iconMarks = data.icons.map((i) => ({
      id: String(i.time), time: i.time, position: i.position, shape: i.shape, color: i.color, size: i.size,
      text: i.text,
    }));
    showStudies(data.studies || {}, data.profile || {});
    fitRange = data.fit;
    // Emptied: another symbol is chosen by emptying the chart first (KrxLive::select), and its
    // bars are followed again.
    if (!bars.length) fit();
    else refit();
    redraw(); // the box hovered stays, over what was sent now
  }

  // A point as the series takes it; a histogram's bar in its colour for its sign (krx-quant #223).
  function pointOf(p, entry) {
    if (p.length < 2) return { time: p[0] };
    const point = { time: p[0], value: p[1] };
    if (entry && entry.histogram) point.color = p[1] >= 0 ? entry.up : entry.down;
    return point;
  }
  function lineOptions(line, guides) {
    const decimals = line.decimals || 0;
    const options = {
      color: line.color, priceLineVisible: false, lastValueVisible: false,
      priceFormat: line.volume ? { type: 'volume' } : { type: 'price', precision: decimals, minMove: Math.pow(10, -decimals) },
    };
    if (!line.histogram) {
      Object.assign(options, {
        lineWidth: line.width, lineVisible: !line.dots, pointMarkersVisible: !!line.dots, crosshairMarkerVisible: false,
      });
      if (line.dots) options.pointMarkersRadius = line.width + 0.5;
    }
    if (guides.length) { // a lower pane keeps its guide lines in view (krx-quant #223)
      options.autoscaleInfoProvider = function (original) {
        const range = original();
        if (!range || !range.priceRange) return range;
        return {
          priceRange: {
            minValue: Math.min(range.priceRange.minValue, ...guides),
            maxValue: Math.max(range.priceRange.maxValue, ...guides),
          },
          margins: range.margins,
        };
      };
    }
    return options;
  }
  // A lower pane's guide lines (70 and 30 for the RSI, krx-quant #223): dashed, without labels,
  // on its first series.
  function showGuides(entry, guides) {
    for (const line of entry.guides) entry.series.removePriceLine(line);
    entry.guides = guides.map((price) => entry.series.createPriceLine({
      price: price, color: fade(colors.text, 0.5), lineWidth: 1, lineStyle: 2, axisLabelVisible: false,
    }));
  }

  function showStudies(s, profileData) {
    sizes = { min_price: s.min_price || 200, pane_min: s.pane_min || 40, pane_max: s.pane_max || 1000 };
    arrangePanes(s.panes || []);
    const keep = new Set();
    const firsts = new Set(); // each lower pane's first series: it carries the pane's guides
    const seen = new Set();
    for (const line of s.series || []) {
      if (line.pane > 0 && !seen.has(line.pane)) {
        seen.add(line.pane);
        firsts.add(line.id);
      }
    }
    for (const line of s.series || []) {
      keep.add(line.id);
      const pane = line.pane > 0 ? lowerPanes[line.pane - 1] || null : null;
      const guides = pane && firsts.has(line.id) ? pane.guides : [];
      let entry = lines.get(line.id);
      if (entry && (entry.pane !== pane || entry.histogram !== !!line.histogram)) {
        chart.removeSeries(entry.series);
        lines.delete(line.id);
        entry = null;
      }
      if (!entry) {
        const type = line.histogram ? L.HistogramSeries : L.LineSeries;
        const options = lineOptions(line, guides);
        entry = {
          series: pane ? pane.api.addSeries(type, options) : chart.addSeries(type, options, 0),
          pane: pane, histogram: !!line.histogram, guides: [],
        };
        lines.set(line.id, entry);
      } else {
        entry.series.applyOptions(lineOptions(line, guides));
      }
      Object.assign(entry, { decimals: line.decimals || 0, up: line.color, down: line.down });
      entry.series.setData(line.points.map((p) => pointOf(p, entry)));
      showGuides(entry, guides);
      entry.times = line.points.map((p) => p[0]);
      entry.values = new Map();
      for (const p of line.points) if (p.length > 1) entry.values.set(p[0], p[1]);
    }
    for (const [id, entry] of lines) {
      if (keep.has(id)) continue;
      chart.removeSeries(entry.series);
      lines.delete(id);
    }
    fills = s.fills || [];
    studyMarks = (s.marks || []).map((m) => ({
      id: 'f' + m.time + (m.above ? 'u' : 'd'), time: m.time, position: m.above ? 'aboveBar' : 'belowBar',
      shape: m.above ? 'arrowUp' : 'arrowDown', color: m.color, size: 1,
    }));
    showMarks();
    profile = profileData && profileData.rows ? profileData : null;
    anchor = s.anchor || null;
    picking = !!s.picking;
    area.style.cursor = picking || tool ? 'crosshair' : '';
    legendRows = s.legend || [];
    buildLegend();
    repaint();
  }

  // Between two lines, filled: the first's colour where it is above (krx-quant #222).
  function drawFills(g, size) {
    const scale = chart.timeScale();
    for (const f of fills) {
      const a = lines.get(f.a), b = lines.get(f.b);
      if (!a || !b) continue;
      let before = null; // the point before, both lines there: [x, ya, yb, va, vb]
      for (const time of a.times) {
        const va = a.values.get(time), vb = b.values.get(time);
        const x = scale.timeToCoordinate(time);
        if (va === undefined || vb === undefined || x === null) { before = null; continue; }
        const ya = main.priceToCoordinate(va), yb = main.priceToCoordinate(vb);
        if (ya === null || yb === null) { before = null; continue; }
        if (before && x >= -50 && before[0] <= size.width + 50) {
          g.fillStyle = va + before[3] >= vb + before[4] ? f.up : f.down;
          g.beginPath();
          g.moveTo(before[0], before[1]);
          g.lineTo(x, ya);
          g.lineTo(x, yb);
          g.lineTo(before[0], before[2]);
          g.closePath();
          g.fill();
        }
        before = [x, ya, yb, va, vb];
      }
    }
  }

  // The volume profile of the bars in view (krx-quant #222): a bar per price row from the right
  // edge, the longest a quarter of the pane wide.
  function drawProfile(g, size) {
    if (!profile || !profile.rows.length) return;
    const most = Math.max.apply(null, profile.rows.map((r) => r.volume));
    if (!(most > 0)) return;
    const widest = size.width * 0.25;
    g.fillStyle = profile.color;
    for (const row of profile.rows) {
      const top = main.priceToCoordinate(row.high), bottom = main.priceToCoordinate(row.low);
      if (top === null || bottom === null) continue;
      const width = (row.volume / most) * widest;
      const height = Math.max(1, bottom - top - 1);
      g.fillRect(size.width - width, top, width, height);
    }
  }

  // The drawings (krx-quant #224), over the prices: the symbol's as the screen sends them, each {id,
  // tool, points: [[logical, price]…] on the bars as drawn, times (its points' moments), color,
  // width, style, text}. The page places them with the tool chosen, picks, drags and removes them,
  // and tells the screen in bar positions; the screen keeps them as moments and prices and sends
  // them back. While a tool is chosen a click on the prices places its next point (a drag from one
  // point to the next places both); otherwise a click on a drawing picks it, a drag moves it (or the
  // point grabbed), a double-click asks for its look, Delete or Backspace removes it, and a click
  // elsewhere is the chart's own (icons, scrolling).
  // Its state is declared with the price series' (above), which is made before this.

  function hexAlpha(color, alpha) {
    const m = /^#([0-9a-f]{6})$/i.exec(color || '');
    if (!m) return fade(color, alpha);
    const v = parseInt(m[1], 16);
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + alpha + ')';
  }
  // Dark text on a light colour, light on a dark one (the axis labels).
  function inkOn(color) {
    const m = /^#([0-9a-f]{6})$/i.exec(color || '');
    if (!m) return '#ffffff';
    const v = parseInt(m[1], 16);
    return 0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255) > 150 ? '#111111' : '#ffffff';
  }
  function paneSize() {
    return { width: chart.timeScale().width(), height: chart.panes()[0].getHeight() };
  }
  // The pointer's place in the price pane's pixels; null outside it.
  function panePoint(e) {
    const box = area.getBoundingClientRect();
    const x = e.clientX - box.left, y = e.clientY - box.top;
    const size = paneSize();
    return x >= 0 && y >= 0 && x < size.width && y < size.height ? [x, y] : null;
  }
  // The magnet (as ChartDrawings::magnet_spot): over a bar, its middle and the nearest of its open,
  // high, low and close (the bar as it is, a Heikin-Ashi chart's too); past the bars, as it is. The
  // screen snaps the points again as they come.
  function snapped(spot) {
    const n = bars.length;
    if (!magnet || !n || spot[0] < -0.5 || spot[0] >= n - 0.5) return spot;
    const i = Math.max(0, Math.min(n - 1, Math.floor(spot[0] + 0.5)));
    if (bars[i].close === undefined) return spot; // an empty bar (krx-quant #236): no price to snap to
    const b = realBars && realBars[i] ? realBars[i] : [bars[i].open, bars[i].high, bars[i].low, bars[i].close];
    let best = b[0];
    for (const v of b) if (Math.abs(v - spot[1]) < Math.abs(best - spot[1])) best = v;
    return [i, best];
  }
  // A bar position's x and back, between bars too (the chart's own coordinateToLogical gives the
  // whole bar under a pixel). They hold on the bars the page has, as the screen's positions do:
  // measured from the last bar's own time, a bar's width a position.
  function barScale() {
    if (!bars.length) return null;
    const scale = chart.timeScale();
    const last = scale.timeToCoordinate(bars[bars.length - 1].time);
    const a = scale.logicalToCoordinate(0), b = scale.logicalToCoordinate(1);
    return last === null || a === null || b === null || b === a ? null : { at: bars.length - 1, x: last, width: b - a };
  }
  function xAt(logical) {
    const s = barScale();
    return s ? s.x + (logical - s.at) * s.width : null;
  }
  function logicalAt(x) {
    const s = barScale();
    return s ? s.at + (x - s.x) / s.width : null;
  }
  // The bar position and price at a pixel of the price pane; the magnet's when ``snap``.
  function spotAt(x, y, snap) {
    const logical = logicalAt(x);
    const price = main.coordinateToPrice(y);
    if (logical === null || price === null) return null;
    return snap ? snapped([logical, price]) : [logical, price];
  }
  function pixelOf(spot) {
    const x = xAt(spot[0]), y = main.priceToCoordinate(spot[1]);
    return x === null || y === null ? null : [x, y];
  }
  function levelText(k) {
    return String(Math.round(k * 1000) / 1000);
  }
  function priceText(price) {
    return Math.round(price).toLocaleString('en-US');
  }
  function fontOf(size, bold) {
    return (bold ? '600 ' : '') + size + 'px ' + (colors.font || 'monospace');
  }

  // What a drawing is made of in the pane's pixels: lines [a, b, guide] (a guide thin and dashed),
  // filled shapes, an ellipse, labels and a text; its handles are its points. Null while one of its
  // points cannot be placed.
  function shapeOf(d, size) {
    const P = [];
    for (const spot of d.points) {
      const p = pixelOf(spot);
      if (!p) return null;
      P.push(p);
    }
    const s = { lines: [], fills: [], ellipse: null, labels: [], text: null, handles: P };
    const far = 4 * (size.width + size.height);
    const ray = function (a, b) { // from a through b, to past the pane's edge
      const dx = b[0] - a[0], dy = b[1] - a[1], length = Math.hypot(dx, dy);
      return length < 1e-6 ? [a, a] : [a, [a[0] + dx / length * far, a[1] + dy / length * far]];
    };
    const across = (y) => [[0, y], [size.width, y]];
    const down = (x) => [[x, 0], [x, size.height]];
    const labelSize = Math.max(9, (colors.size || 11) - 1);
    switch (d.tool) {
      case 'trend_line':
        s.lines.push([P[0], P[1]]);
        break;
      case 'ray':
        s.lines.push(ray(P[0], P[1]));
        break;
      case 'horizontal':
        s.lines.push(across(P[0][1]));
        break;
      case 'vertical':
        s.lines.push(down(P[0][0]));
        break;
      case 'cross':
        s.lines.push(across(P[0][1]), down(P[0][0]));
        break;
      case 'rectangle': {
        const [a, b] = P;
        const corners = [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]]];
        for (let i = 0; i < 4; ++i) s.lines.push([corners[i], corners[(i + 1) % 4]]);
        s.fills.push({ points: corners, alpha: 0.12 });
        break;
      }
      case 'ellipse': { // within the box of its two points
        const [a, b] = P;
        s.ellipse = {
          x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2, rx: Math.abs(b[0] - a[0]) / 2, ry: Math.abs(b[1] - a[1]) / 2,
        };
        break;
      }
      case 'pitchfork': { // Andrews': the median from the first point through the middle of the
        // other two, and the tines from them along it
        const [a, b, c] = P;
        const middle = [(b[0] + c[0]) / 2, (b[1] + c[1]) / 2];
        const along = [middle[0] - a[0], middle[1] - a[1]];
        s.lines.push(ray(a, middle), ray(b, [b[0] + along[0], b[1] + along[1]]),
          ray(c, [c[0] + along[0], c[1] + along[1]]), [b, c]);
        break;
      }
      case 'fib_retracement': { // 0 at the second point, 1 at the first, across the two
        const [a, b] = P;
        const left = Math.min(a[0], b[0]), right = Math.max(a[0], b[0]);
        s.lines.push([a, b, true]);
        s.fills.push({ points: [[left, a[1]], [right, a[1]], [right, b[1]], [left, b[1]]], alpha: 0.06 });
        for (const k of FIB) {
          const y = b[1] + (a[1] - b[1]) * k;
          const price = main.coordinateToPrice(y);
          s.lines.push([[left, y], [right, y]]);
          s.labels.push({ // just above its line, from the left
            x: left + 4, y: y - 2, align: 'left', baseline: 'bottom', size: labelSize,
            text: levelText(k) + (price === null ? '' : ' (' + priceText(price) + ')'),
          });
        }
        break;
      }
      case 'fib_channel': { // lines along the first two points, the third's at 1
        const [a, b, c] = P;
        const dx = b[0] - a[0];
        const offset = Math.abs(dx) > 1e-6 ? [0, c[1] - (a[1] + (c[0] - a[0]) * (b[1] - a[1]) / dx)] : [c[0] - a[0], 0];
        s.fills.push({
          points: [a, b, [b[0] + offset[0], b[1] + offset[1]], [a[0] + offset[0], a[1] + offset[1]]], alpha: 0.06,
        });
        for (const k of FIB) {
          const from = [a[0] + offset[0] * k, a[1] + offset[1] * k];
          const to = [b[0] + offset[0] * k, b[1] + offset[1] * k];
          s.lines.push([from, to]);
          const start = from[0] <= to[0] ? from : to;
          s.labels.push({ x: start[0] + 4, y: start[1] - 2, align: 'left', baseline: 'bottom', size: labelSize, text: levelText(k) });
        }
        break;
      }
      case 'fib_fan': { // from the first point through the levels of the box up to the second
        const [a, b] = P;
        const corner1 = [b[0], a[1]], corner2 = [a[0], b[1]];
        s.lines.push([a, corner1, true], [corner1, b, true], [b, corner2, true], [corner2, a, true]);
        const right = b[0] >= a[0], below = b[1] >= a[1];
        for (const k of [1].concat(FAN)) { // the price levels, on the second point's side
          const p = [b[0], a[1] + (b[1] - a[1]) * k];
          s.lines.push(ray(a, p));
          s.labels.push({ x: b[0] + (right ? 4 : -4), y: p[1], align: right ? 'left' : 'right', size: labelSize, text: levelText(k) });
        }
        for (const k of FAN) { // the time levels, on its price
          const p = [a[0] + (b[0] - a[0]) * k, b[1]];
          s.lines.push(ray(a, p));
          s.labels.push({ x: p[0], y: b[1] + (below ? 10 : -10), align: 'center', size: labelSize, text: levelText(k) });
        }
        break;
      }
      case 'text': { // to the right of its point, its middle on the point's price
        const px = TEXT_SIZES[Math.max(0, Math.min(3, d.width - 1))];
        measure.font = fontOf(px, true);
        const width = measure.measureText(d.text || '').width;
        const x = P[0][0] + 8, y = P[0][1];
        s.text = { x: x, y: y, size: px, text: d.text || '', box: [P[0][0] - 4, y - px * 0.7, width + 16, px * 1.4] };
        break;
      }
    }
    return s;
  }

  function lineDash(style, width) {
    return style === 'dotted' ? [width, width * 2] : style === 'dashed' ? [width * 4, width * 3] : [];
  }

  function paintDrawing(g, d, s, selected) {
    g.save();
    g.lineJoin = 'round';
    for (const f of s.fills) {
      g.fillStyle = hexAlpha(d.color, f.alpha);
      g.beginPath();
      f.points.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
      g.closePath();
      g.fill();
    }
    g.strokeStyle = d.color;
    for (const [a, b, guide] of s.lines) {
      g.lineWidth = guide ? 1 : d.width;
      g.setLineDash(guide ? [4, 4] : lineDash(d.style, d.width));
      g.globalAlpha = guide ? 0.55 : 1;
      g.beginPath();
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0], b[1]);
      g.stroke();
    }
    g.globalAlpha = 1;
    if (s.ellipse) {
      const e = s.ellipse;
      g.beginPath();
      g.ellipse(e.x, e.y, Math.max(0.5, e.rx), Math.max(0.5, e.ry), 0, 0, 2 * Math.PI);
      g.fillStyle = hexAlpha(d.color, 0.12);
      g.fill();
      g.lineWidth = d.width;
      g.setLineDash(lineDash(d.style, d.width));
      g.stroke();
    }
    g.setLineDash([]);
    g.fillStyle = d.color;
    const taken = []; // a label that would cover one drawn (a narrow fan's) is left out
    for (const label of s.labels) {
      g.font = fontOf(label.size, false);
      const width = g.measureText(label.text).width;
      const left = label.align === 'right' ? label.x - width : label.align === 'center' ? label.x - width / 2 : label.x;
      const top = label.baseline === 'bottom' ? label.y - label.size : label.y - label.size / 2;
      const box = [left - 2, top, left + width + 2, top + label.size];
      if (taken.some((t) => box[0] < t[2] && t[0] < box[2] && box[1] < t[3] && t[1] < box[3])) continue;
      taken.push(box);
      g.textAlign = label.align;
      g.textBaseline = label.baseline || 'middle';
      g.fillText(label.text, label.x, label.y);
    }
    if (s.text) {
      g.font = fontOf(s.text.size, true);
      g.textAlign = 'left';
      g.textBaseline = 'middle';
      g.fillText(s.text.text, s.text.x, s.text.y);
      if (selected) { // its box, faint
        g.strokeStyle = hexAlpha(d.color, 0.5);
        g.lineWidth = 1;
        g.setLineDash([3, 3]);
        g.strokeRect(...s.text.box);
        g.setLineDash([]);
      }
    }
    if (selected) { // the handles: its points
      g.lineWidth = 1.5;
      g.strokeStyle = d.color;
      g.fillStyle = colors.background || colors.tip_background;
      for (const [x, y] of s.handles) {
        g.beginPath();
        g.arc(x, y, 4.5, 0, 2 * Math.PI);
        g.fill();
        g.stroke();
      }
    }
    g.restore();
  }

  // The drawing as shown now: the one dragged where it is dragged to.
  function current(d) {
    return grab && grab.id === d.id ? grab.drawing : d;
  }

  function drawDrawings(g, size) {
    if (drawingsHidden || !bars.length) return;
    for (const d of drawings) {
      const shown = current(d);
      const s = shapeOf(shown, size);
      if (s) paintDrawing(g, shown, s, d.id === selectedId);
    }
    if (tool) { // the one being placed, its next point under the pointer
      const spots = placed.concat(follow ? [follow] : []);
      if (!spots.length) return;
      while (spots.length < tool.points) spots.push(spots[spots.length - 1]);
      const d = {
        tool: tool.tool, points: spots, color: tool.color, width: tool.width, style: tool.style, text: tool.text,
      };
      const s = shapeOf(d, size);
      if (s) paintDrawing(g, d, s, true);
    }
  }

  // A horizontal line's price on the price axis, a vertical line's time on the time axis.
  function timeText(time) {
    const t = new Date(time * 1000); // chart_time: KST read as UTC
    const two = (n) => String(n).padStart(2, '0');
    const date = two(t.getUTCMonth() + 1) + '-' + two(t.getUTCDate());
    return dated ? t.getUTCFullYear() + '-' + date : date + ' ' + two(t.getUTCHours()) + ':' + two(t.getUTCMinutes());
  }
  function axisLabel(coordinate, text, color) {
    return {
      coordinate: () => coordinate, text: () => text, textColor: () => inkOn(color), backColor: () => color,
    };
  }
  function drawingAxisViews(axis) {
    if (drawingsHidden || !bars.length) return [];
    const views = [];
    for (const original of drawings) {
      const d = current(original);
      const across = d.tool === 'horizontal' || d.tool === 'cross';
      const down = d.tool === 'vertical' || d.tool === 'cross';
      if (axis === 'price' && across) {
        const y = main.priceToCoordinate(d.points[0][1]);
        if (y !== null) views.push(axisLabel(y, priceText(d.points[0][1]), d.color));
      }
      if (axis === 'time' && down) {
        const x = xAt(d.points[0][0]);
        // Dragged, the bar under it until the screen sends its moment.
        const i = Math.max(0, Math.min(bars.length - 1, Math.round(d.points[0][0])));
        const time = d === original && d.times ? d.times[0] : bars[i].time;
        if (x !== null) views.push(axisLabel(x, timeText(time), d.color));
      }
    }
    return views;
  }
  function drawingPrimitive() {
    const renderer = {
      draw(target) {
        target.useMediaCoordinateSpace(function (scope) { drawDrawings(scope.context, scope.mediaSize); });
      },
    };
    const view = { zOrder: () => 'top', renderer: () => renderer };
    return {
      paneViews: () => [view],
      priceAxisViews: () => drawingAxisViews('price'),
      timeAxisViews: () => drawingAxisViews('time'),
      updateAllViews() {},
      attached(param) { redrawPrices = param.requestUpdate; },
    };
  }

  function segmentDistance(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], length = dx * dx + dy * dy;
    const t = length < 1e-9 ? 0 : Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / length));
    return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
  }
  function inside(p, polygon) {
    let within = false;
    for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
      const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
      if (yi > p[1] !== yj > p[1] && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) within = !within;
    }
    return within;
  }
  function hits(s, d, x, y) {
    const near = Math.max(5, d.width / 2 + 3);
    for (const [a, b] of s.lines) if (segmentDistance([x, y], a, b) <= near) return true;
    for (const f of s.fills) if (inside([x, y], f.points)) return true;
    if (s.ellipse) {
      const e = s.ellipse;
      const r = Math.pow((x - e.x) / Math.max(e.rx, 1), 2) + Math.pow((y - e.y) / Math.max(e.ry, 1), 2);
      if (r <= 1.1) return true;
    }
    if (s.text) {
      const [left, top, width, height] = s.text.box;
      if (x >= left && x <= left + width && y >= top && y <= top + height) return true;
    }
    return false;
  }
  // The drawing under the pixel (x, y), the topmost (the last drawn) first, and its point grabbed
  // there (-1: the whole drawing).
  function drawingAt(x, y) {
    if (drawingsHidden) return null;
    const size = paneSize();
    for (let i = drawings.length - 1; i >= 0; --i) {
      const d = drawings[i], s = shapeOf(d, size);
      if (!s) continue;
      for (let k = 0; k < s.handles.length; ++k)
        if (Math.hypot(s.handles[k][0] - x, s.handles[k][1] - y) <= 7) return { d: d, grip: k };
      if (hits(s, d, x, y)) return { d: d, grip: -1 };
    }
    return null;
  }

  function showDrawings(data) {
    if (!data) return;
    drawings = data.items || [];
    drawingsHidden = !!data.hidden;
    magnet = !!data.magnet;
    if (data.select > 0) selectedId = data.select;
    else if (data.select < 0 || !drawings.some((d) => d.id === selectedId)) selectedId = 0;
    if (grab && !drawings.some((d) => d.id === grab.id)) grab = null;
    repaint();
  }

  // The bars now start elsewhere (older ones read, or another symbol): the points being placed or
  // dragged move by the bars before the old first one; on other bars they go.
  function rebaseDrawing(firstBefore) {
    if (firstBefore === null || (!placed.length && !grab)) return;
    const shift = bars.length ? barAt.get(firstBefore) : undefined;
    if (shift === undefined) {
      placed = [];
      follow = null;
      grab = null;
      return;
    }
    if (!shift) return;
    const move = (spot) => [spot[0] + shift, spot[1]];
    placed = placed.map(move);
    if (follow) follow = move(follow);
    if (grab) {
      grab.start = move(grab.start);
      grab.from = grab.from.map(move);
      grab.drawing.points = grab.drawing.points.map(move);
    }
  }

  function setTool(chosen) {
    tool = chosen && chosen.tool ? chosen : null;
    placed = [];
    follow = null;
    downAt = null;
    if (tool) selectedId = 0;
    area.style.cursor = tool || picking ? 'crosshair' : '';
    repaint();
  }
  // Back to the cursor: the drawing placed, or Esc.
  function endTool() {
    setTool(null);
    if (bridge) bridge.tool_ended();
  }
  function placeNext(spot) {
    placed.push(spot);
    if (placed.length < tool.points) return repaint();
    const box = area.getBoundingClientRect();
    const last = pixelOf(spot) || [0, 0];
    if (bridge) {
      bridge.drawn(JSON.stringify({
        tool: tool.tool, points: placed.slice(0, tool.points), first: bars[0].time, x: box.left + last[0], y: box.top + last[1],
      }));
    }
    endTool();
  }

  function startGrab(hit, at) {
    const start = spotAt(at[0], at[1], false);
    if (!start) return;
    const copy = (points) => points.map((p) => p.slice());
    grab = {
      id: hit.d.id, grip: hit.grip, start: start, from: copy(hit.d.points), at: at, moved: false,
      drawing: Object.assign({}, hit.d, { points: copy(hit.d.points) }),
    };
    // Grabbed: the chart does not scroll while it moves.
    chart.applyOptions({ handleScroll: false, handleScale: false });
    const move = function (m) {
      if (!grab) return;
      const box = area.getBoundingClientRect();
      const x = m.clientX - box.left, y = m.clientY - box.top;
      if (!grab.moved && Math.hypot(x - grab.at[0], y - grab.at[1]) < 3) return;
      grab.moved = true;
      if (grab.grip >= 0) { // one point, on the magnet's when on
        const spot = spotAt(x, y, true);
        if (spot) grab.drawing.points[grab.grip] = spot;
      } else { // the whole drawing, as far as the pointer went
        const now = spotAt(x, y, false);
        if (now) {
          const dl = now[0] - grab.start[0], dp = now[1] - grab.start[1];
          grab.drawing.points = grab.from.map((p) => [p[0] + dl, p[1] + dp]);
        }
      }
      repaint();
    };
    const up = function () {
      window.removeEventListener('mousemove', move, true);
      window.removeEventListener('mouseup', up, true);
      chart.applyOptions({ handleScroll: true, handleScale: true });
      const done = grab;
      grab = null;
      if (done && done.moved && bars.length) {
        const d = drawings.find((one) => one.id === done.id);
        if (d) d.points = done.drawing.points; // where it was dropped, until the screen sends it
        if (bridge) {
          bridge.reshaped(JSON.stringify({ id: done.id, grip: done.grip, points: done.drawing.points, first: bars[0].time }));
        }
      }
      repaint();
    };
    window.addEventListener('mousemove', move, true);
    window.addEventListener('mouseup', up, true);
    repaint();
  }

  // Before the chart's own handlers (and the anchored VWAP's marker): a drawing tool's clicks, and
  // a drawing grabbed, are not the chart's.
  area.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || !bars.length) return;
    if (e.target && e.target.style && e.target.style.cursor === 'row-resize') return; // a border between panes
    const at = panePoint(e);
    if (tool) {
      if (!at) return;
      e.stopImmediatePropagation();
      e.preventDefault();
      const spot = spotAt(at[0], at[1], true);
      if (!spot) return;
      downAt = at;
      placeNext(spot);
      return;
    }
    const hit = at ? drawingAt(at[0], at[1]) : null;
    if (!hit) {
      if (selectedId) {
        selectedId = 0;
        repaint();
      }
      return; // the chart's: scrolling, an icon's click
    }
    e.stopImmediatePropagation();
    e.preventDefault();
    selectedId = hit.d.id;
    startGrab(hit, at);
  }, true);
  // A drag from one point placed to the next places that one where the button comes up.
  area.addEventListener('mouseup', function (e) {
    if (!tool || e.button !== 0) return;
    e.stopImmediatePropagation();
    const at = panePoint(e);
    if (!at || !downAt || !placed.length || Math.hypot(at[0] - downAt[0], at[1] - downAt[1]) < 5) return;
    downAt = null;
    const spot = spotAt(at[0], at[1], true);
    if (spot) placeNext(spot);
  }, true);
  area.addEventListener('mousemove', function (e) {
    if (grab) return;
    const at = panePoint(e);
    if (tool) {
      follow = at ? spotAt(at[0], at[1], true) : null;
      return repaint();
    }
    if (!drawings.length || drawingsHidden) return;
    const hit = at ? drawingAt(at[0], at[1]) : null;
    const cursor = hit ? (hit.grip >= 0 ? 'move' : 'pointer') : picking ? 'crosshair' : '';
    if (area.style.cursor !== cursor) area.style.cursor = cursor;
  }, true);
  area.addEventListener('mouseleave', function () {
    if (!tool || !follow) return;
    follow = null;
    repaint();
  });
  // A drawing double-clicked: the screen opens its look's popup there (not the chart's fit).
  area.addEventListener('dblclick', function (e) {
    if (tool) {
      e.stopImmediatePropagation();
      e.preventDefault();
      return;
    }
    const at = panePoint(e);
    const hit = at ? drawingAt(at[0], at[1]) : null;
    if (!hit) return;
    e.stopImmediatePropagation();
    e.preventDefault();
    selectedId = hit.d.id;
    repaint();
    if (bridge) bridge.edit(hit.d.id, e.clientX, e.clientY);
  }, true);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (tool) {
        e.preventDefault();
        endTool();
      } else if (selectedId) {
        selectedId = 0;
        repaint();
      }
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId && !tool && !grab) {
      e.preventDefault();
      const id = selectedId;
      selectedId = 0;
      drawings = drawings.filter((d) => d.id !== id);
      repaint();
      if (bridge) bridge.erased(id);
    }
  });

  // The anchored VWAP's bar (krx-quant #222): a dashed line down the price pane with a handle at
  // its foot. Dragged, it follows the pointer to a bar.
  function anchorX() {
    const time = dragTime !== null ? dragTime : anchor ? anchor.time : null;
    return time === null ? null : chart.timeScale().timeToCoordinate(time);
  }
  function drawAnchor(g, size) {
    if (!anchor) return;
    const x = anchorX();
    if (x === null) return;
    g.strokeStyle = anchor.color;
    g.globalAlpha = 0.75;
    g.lineWidth = 1;
    g.setLineDash([4, 3]);
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, size.height);
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha = 1;
    g.fillStyle = anchor.color;
    g.beginPath(); // a diamond at the foot: the handle
    g.moveTo(x, size.height - 16);
    g.lineTo(x + 6, size.height - 10);
    g.lineTo(x, size.height - 4);
    g.lineTo(x - 6, size.height - 10);
    g.closePath();
    g.fill();
  }
  // The bar under ``x``: the nearest, within the bars read.
  function barTimeAt(x) {
    const logical = chart.timeScale().coordinateToLogical(x);
    if (logical === null || !bars.length) return null;
    return bars[Math.max(0, Math.min(bars.length - 1, Math.round(logical)))].time;
  }
  area.addEventListener('mousedown', function (e) {
    if (!anchor || e.button !== 0) return;
    const box = area.getBoundingClientRect();
    const x = e.clientX - box.left, y = e.clientY - box.top;
    const ax = anchorX();
    if (ax === null || Math.abs(x - ax) > 6 || y > chart.panes()[0].getHeight()) return;
    // Grabbed: the chart does not scroll while the marker moves.
    e.stopPropagation();
    e.preventDefault();
    chart.applyOptions({ handleScroll: false, handleScale: false });
    dragTime = anchor.time;
    document.body.style.cursor = 'ew-resize';
    const move = function (m) {
      const time = barTimeAt(m.clientX - box.left);
      if (time !== null && time !== dragTime) { dragTime = time; repaint(); }
    };
    const up = function () {
      window.removeEventListener('mousemove', move, true);
      window.removeEventListener('mouseup', up, true);
      chart.applyOptions({ handleScroll: true, handleScale: true });
      document.body.style.cursor = '';
      if (dragTime !== null && dragTime !== anchor.time && bridge) bridge.anchored(dragTime);
      if (dragTime !== null) anchor = { time: dragTime, color: anchor.color }; // until the screen sends it
      dragTime = null;
      repaint();
    };
    window.addEventListener('mousemove', move, true);
    window.addEventListener('mouseup', up, true);
  }, true);

  // Each pane's legend (krx-quant #222): a row per indicator with its name, its settings and its
  // lines' values at the crosshair (or the last bar). Hovered, a row shows its buttons: hide (the
  // eye), settings and delete; the screen does what they ask.
  const ICONS = {
    eye: '<svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
    hidden: '<svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><path d="M2.5 13.5l11-11"/></svg>',
    settings: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg>',
    remove: '<svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  };
  let valueSpans = []; // [{span, id}] of the rows built
  let missingSpans = []; // [{span, ids}]: a row's reason, shown where none of its lines has a value
  function buildLegend() {
    valueSpans = [];
    missingSpans = [];
    for (const box of legendBoxes) box.textContent = '';
    for (const row of legendRows) {
      const box = legendBox(row.pane || 0);
      const el = document.createElement('div');
      el.className = 'row' + (row.hidden ? ' hidden' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = row.title;
      el.appendChild(name);
      if (row.settings) {
        const settings = document.createElement('span');
        settings.className = 'settings';
        settings.textContent = row.settings;
        el.appendChild(settings);
      }
      if (!row.hidden) {
        row.values.forEach(function (id, i) {
          const span = document.createElement('span');
          span.style.color = row.colors[i] || colors.text;
          el.appendChild(span);
          valueSpans.push({ span: span, id: id });
        });
      }
      if (row.missing && !row.hidden) { // e.g. the VWAP of a day not read whole
        const missing = document.createElement('span');
        missing.className = 'note';
        missing.textContent = row.missing;
        el.appendChild(missing);
        missingSpans.push({ span: missing, ids: row.values });
      }
      if (row.note) {
        const note = document.createElement('span');
        note.className = 'note';
        note.textContent = row.note;
        el.appendChild(note);
      }
      const tools = document.createElement('span');
      tools.className = 'tools';
      for (const [action, icon, title] of [
        ['hide', row.hidden ? ICONS.hidden : ICONS.eye, row.hidden ? '보이기' : '숨기기'],
        ['settings', ICONS.settings, '설정'],
        ['remove', ICONS.remove, '삭제'],
      ]) {
        const button = document.createElement('span');
        button.innerHTML = icon;
        button.title = title;
        button.addEventListener('click', function (e) {
          e.stopPropagation();
          if (bridge) bridge.legend(row.key, action);
        });
        tools.appendChild(button);
      }
      el.appendChild(tools);
      // Its buttons while hovered (a class, so a synthetic hover shows them too).
      el.addEventListener('mouseenter', function () { el.classList.add('hover'); });
      el.addEventListener('mouseleave', function () { el.classList.remove('hover'); });
      box.appendChild(el);
    }
    placeLegend();
    showLegendValues(legendTime);
  }
  // The values at ``time`` (the crosshair's), or at the last bar when there is none.
  let legendTime = null;
  function showLegendValues(time) {
    legendTime = time;
    const at = time !== null && time !== undefined ? time : bars.length ? bars[bars.length - 1].time : null;
    const valueAt = function (id) {
      return id === 'volume' ? volumeAt.get(at) : (lines.get(id) || { values: new Map() }).values.get(at);
    };
    // An empty bar (krx-quant #236) has no values: no reason why one is missing either.
    const index = at === null ? undefined : barAt.get(at);
    const empty = index !== undefined && bars[index].close === undefined;
    for (const { span, id } of valueSpans) {
      const value = valueAt(id);
      const decimals = id === 'volume' ? 0 : (lines.get(id) || {}).decimals || 0; // a lower one's (krx-quant #223)
      span.textContent = value === undefined ? ''
        : value.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
      span.style.display = value === undefined ? 'none' : '';
    }
    for (const { span, ids } of missingSpans)
      span.style.display = empty || ids.some((id) => valueAt(id) !== undefined) ? 'none' : '';
  }
  // Each at the top left of its pane, the panes top down with a pixel's border between them.
  function placeLegend() {
    const panes = chart.panes();
    let top = 0;
    panes.forEach(function (pane, i) {
      const box = legendBox(i);
      box.style.display = '';
      box.style.top = (top + 4) + 'px';
      top += pane.getHeight() + 1;
    });
    for (let i = panes.length; i < legendBoxes.length; ++i) legendBoxes[i].style.display = 'none';
  }
  setInterval(placeLegend, 300); // a border between panes dragged

  // Hover boxes set and dropped (krx-quant #159): only those changed come.
  function boxes(data) {
    if (data.reset) hoverAt = new Map();
    for (const box of data.set) hoverAt.set(box.time, box);
    for (const time of data.drop) hoverAt.delete(time);
    redraw();
  }

  // The bar being made moved (krx-quant #110): only the last bar is drawn again, or a new
  // one follows it. One older than the last drawn is not drawn. The indicators' points it moves
  // come with it (krx-quant #222): each the last of its line.
  function live(data) {
    if (!data.bar) { // bricks (krx-quant #225), unchanged: the price line at the bar's close
      showReal(data.last);
      return;
    }
    if (!bars.length || data.bar.time < bars[bars.length - 1].time) return;
    // A new bar after minutes without trades (krx-quant #236): their empty bars first, a slot each.
    for (const time of data.gap || []) {
      if (time <= bars[bars.length - 1].time) continue;
      main.update({ time: time });
      if (volumes) volumes.update({ time: time });
      volumeAt.set(time, 0);
      barAt.set(time, bars.length);
      bars.push({ time: time });
    }
    if (data.special) specialBands = data.special; // the bands on those slots
    main.update(point(data.bar));
    if (volumes) volumes.update(data.volume);
    volumeAt.set(data.volume.time, data.volume.value);
    showReal(data.last);
    if (data.bar.time === bars[bars.length - 1].time) {
      bars[bars.length - 1] = data.bar;
    } else {
      barAt.set(data.bar.time, bars.length);
      bars.push(data.bar);
    }
    // A Heikin-Ashi chart's bar being made as it is, for the magnet (krx-quant #224): in step with
    // the bars, the last replaced or a new one added.
    if (realBars && data.real) realBars[bars.length - 1] = data.real;
    for (const [id, p] of data.studies || []) {
      const entry = lines.get(id);
      if (!entry) continue;
      try {
        entry.series.update(pointOf(p, entry));
      } catch (e) {
        continue; // before its last point: drawn again at the bar close
      }
      if (!entry.times.length || entry.times[entry.times.length - 1] < p[0]) entry.times.push(p[0]);
      if (p.length > 1) entry.values.set(p[0], p[1]); else entry.values.delete(p[0]);
    }
    if (data.marks) {
      studyMarks = data.marks.map((m) => ({
        id: 'f' + m.time + (m.above ? 'u' : 'd'), time: m.time, position: m.above ? 'aboveBar' : 'belowBar',
        shape: m.above ? 'arrowUp' : 'arrowDown', color: m.color, size: 1,
      }));
      showMarks();
    }
    if (data.profile) profile = data.profile.rows ? data.profile : null;
    showLegendValues(legendTime);
    repaint();
  }

  // The hovered bar's four-minute window (krx-quant #167): the span from its bar close to four
  // minutes on, lightly filled; the touch targets across it, once its label is in (another kind's
  // two levels the same way: the range's, #182; the barrier's U and L, #185, from its bar close on
  // when the engine gives its mid-point with the prediction, #210); where each was first reached,
  // the upper in the rising colour, the lower in the falling one. A window not over yet runs
  // dotted into the free space on the right, its levels too.
  function xOf(time) {
    // A moment's x on the logical bars: within its minute's bar; in minutes without a bar
    // (the chart skips minutes without trades), at the edge where the next bar starts; past
    // the last bar, on the free space at a bar a minute.
    if (!bars.length || time < bars[0].time) return null;
    const last = bars.length - 1;
    let lo = 0, hi = last; // the last bar starting at or before ``time``
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (bars[mid].time <= time) lo = mid; else hi = mid - 1;
    }
    const into = time - bars[lo].time;
    return logicalX(lo - 0.5 + (lo === last ? into : Math.min(into, 60)) / 60);
  }

  // A fractional logical position's x, between those of the whole bars around it: the chart's own
  // logicalToCoordinate takes whole bars only (a fraction gave 0, so the window drew at the left
  // edge, krx-quant #182).
  function logicalX(logical) {
    const scale = chart.timeScale();
    const whole = Math.floor(logical);
    const a = scale.logicalToCoordinate(whole), b = scale.logicalToCoordinate(whole + 1);
    if (a === null || b === null) return null;
    return a + (b - a) * (logical - whole);
  }

  function drawWindow(box) {
    const ratio = window.devicePixelRatio || 1;
    links.width = area.clientWidth * ratio;
    links.height = area.clientHeight * ratio;
    const g = links.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, area.clientWidth, area.clientHeight);
    if (!box || box.from === undefined) return; // an empty bar's box, a wider view's: no window (krx-quant #236)
    const x1 = xOf(box.from), x2 = xOf(box.to);
    if (x1 === null || x2 === null) return;
    const open = !bars.length || box.to > bars[bars.length - 1].time + 60; // not over yet
    const foot = chart.panes()[0].getHeight();
    g.globalAlpha = 0.08;
    g.fillStyle = colors.link;
    g.fillRect(x1, 0, x2 - x1, foot);
    g.globalAlpha = 1;
    if (open) { // its end still to come: the window's edges dotted, targets or not
      g.strokeStyle = colors.link;
      g.lineWidth = 1;
      g.setLineDash([4, 3]);
      g.strokeRect(x1, 0, x2 - x1, foot);
    }
    g.lineWidth = 1.5;
    g.setLineDash(open ? [4, 3] : []);
    for (const [price, color] of [[box.upper, colors.up], [box.lower, colors.down]]) {
      if (price === undefined) continue;
      const y = main.priceToCoordinate(price);
      if (y === null) continue;
      g.strokeStyle = color;
      g.beginPath();
      g.moveTo(x1, y);
      g.lineTo(x2, y);
      g.stroke();
    }
    g.setLineDash([]);
    for (const [point, color] of [[box.upper_reached, colors.up], [box.lower_reached, colors.down]]) {
      if (!point) continue;
      const x = xOf(point.time), y = main.priceToCoordinate(point.price);
      if (x === null || y === null) continue;
      g.fillStyle = color;
      g.beginPath();
      g.arc(x, y, 4, 0, 2 * Math.PI);
      g.fill();
    }
  }

  function hide() {
    tip.style.display = 'none';
    drawWindow(null);
  }

  // The box of the bar under the pointer, anywhere on its column (krx-quant #159); the legend's
  // values at it (krx-quant #222).
  function hover(param) {
    if (!param || !param.point || param.time === undefined) {
      hovered = null;
      crossSlot = null;
      showLegendValues(null);
      return hide();
    }
    hovered = { time: param.time, x: param.point.x };
    showLegendValues(param.time);
    if (bricks && crossSlot !== param.time) { // the crosshair's time on bricks (krx-quant #225)
      crossSlot = param.time;
      repaint();
    }
    redraw();
  }

  function redraw() {
    const box = hovered ? hoverAt.get(hovered.time) : undefined;
    if (!box) return hide();
    tip.textContent = box.lines.join('\n');
    tip.style.display = 'block';
    // At the foot of the price pane, on the side away from the pointer: it covers neither
    // the bar hovered nor its link. Kept inside the chart when it is tall.
    const right = hovered.x < area.clientWidth / 2;
    const foot = chart.panes()[0].getHeight();
    const top = Math.min(foot - tip.offsetHeight - 6, area.clientHeight - tip.offsetHeight - 6);
    tip.style.top = Math.max(6, top) + 'px';
    tip.style.left = right ? Math.max(6, area.clientWidth - tip.offsetWidth - 70) + 'px' : '6px';
    drawWindow(box);
  }
  chart.subscribeCrosshairMove(hover);

  // The view moved: within a screen of its left end the screen reads the bars before
  // (krx-quant #108, #239). The chart keeps the view on the same bars when they come in before
  // the first.
  chart.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
    if (range && bars.length && bridge) bridge.moved(range.from, range.to);
  });
  // The bars in view, by time: the score over them (krx-quant #159), the volume profile
  // (krx-quant #222).
  chart.timeScale().subscribeVisibleTimeRangeChange(function (range) {
    if (range && bridge) bridge.range(range.from, range.to);
  });

  // An icon clicked: the screen shows that bar close's judgements (krx-quant #107). While the
  // anchored VWAP waits for its bar (krx-quant #222), a click anywhere chooses the bar under it.
  let bridge = null;
  chart.subscribeClick(function (param) {
    if (picking && param && param.point && bars.length && bridge) {
      const time = barTimeAt(param.point.x);
      if (time !== null) {
        picking = false;
        area.style.cursor = '';
        bridge.anchored(time);
      }
      return;
    }
    const icon = param && param.hoveredObjectId !== undefined ? iconAt.get(String(param.hoveredObjectId)) : undefined;
    if (icon && bridge) bridge.clicked(icon.bar_close);
  });

  function theme(t) {
    colors = t;
    document.body.style.background = t.background;
    tip.style.background = t.tip_background;
    tip.style.borderColor = t.tip_border;
    tip.style.color = t.tip_text;
    tip.style.fontFamily = t.font;
    tip.style.fontSize = (t.size + 1) + 'px';
    scroller.style.setProperty('--thumb', t.border);
    for (const box of legendBoxes) styleLegend(box);
    scaleBox.style.color = t.text;
    scaleBox.style.fontFamily = t.font;
    scaleBox.style.fontSize = t.size + 'px';
    scaleBox.style.setProperty('--background', t.background);
    scaleBox.style.setProperty('--hover', fade(t.tip_background, 0.85));
    scaleBox.style.setProperty('--on', t.link);
    chart.applyOptions({
      layout: {
        background: { type: 'solid', color: t.background },
        textColor: t.text,
        fontFamily: t.font,
        fontSize: t.size,
        attributionLogo: false,
        panes: { separatorColor: t.border, separatorHoverColor: t.border },
      },
      grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
      rightPriceScale: { borderColor: t.border },
