<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The KRX screen's chart (fork addition, codeyoma/krx-quant#105–#110, #159, #167, #182, #185,
  #221), drawn with TradingView Lightweight Charts (NOTICE). It only draws what the screen sends
  over the web channel: the bars in the style chosen and their volumes, the days' first bars
  filled, the consensus icons, each bar's hover box and its four-minute window with two levels
  across it (the touch targets, the range's highest and lowest mid-points, or the barrier's U
  and L), the theme, and when to fit. It tells the screen where its view is.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080808; }
  #chart, #links { position: absolute; inset: 0; }
  #links { pointer-events: none; z-index: 60; width: 100%; height: 100%; } /* above the chart's own canvases (z-index up to 50) */
  #tip {
    position: absolute; display: none; pointer-events: none; white-space: pre-wrap;
    padding: 4px 8px; border: 1px solid; z-index: 61;
    max-width: calc(100% - 30px); box-sizing: border-box; /* a long line wraps inside the chart */
  }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="chart"></div>
<canvas id="links"></canvas>
<div id="tip"></div>
<script>
(function () {
  const L = LightweightCharts;
  const area = document.getElementById('chart');
  const links = document.getElementById('links');
  const tip = document.getElementById('tip');
  const chart = L.createChart(area, {
    autoSize: true,
    layout: { attributionLogo: false }, // the attribution is on the panel title and in the README
    // The latest target's slot shows on the right; on the left the view stops at the first bar
    // read, where the bars before are read (krx-quant #108).
    timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6, fixLeftEdge: true },
  });
  let colors = {
    tip_background: '#111', tip_border: '#333', tip_text: '#e5e5e5', link: '#f59e0b', up: '#16a34a', down: '#dc2626',
    band: 'rgba(128,128,128,0.22)',
  };

  // ``color`` (rgba(r,g,b,a) from the screen) at ``alpha``.
  function fade(color, alpha) {
    const m = /rgba?\(([^)]+)\)/.exec(color);
    return m ? 'rgba(' + m[1].split(',').slice(0, 3).join(',') + ',' + alpha + ')' : color;
  }

  // The days' first bars of a minute view, filled grey behind the bars (krx-quant #221): a band a
  // bar wide, the pane's height, in each pane it is attached to.
  let bandTimes = [];
  function bandPrimitive() {
    const renderer = {
      draw(target) {
        if (!bandTimes.length) return;
        target.useBitmapCoordinateSpace(function (scope) {
          const scale = chart.timeScale();
          const a = scale.logicalToCoordinate(0), b = scale.logicalToCoordinate(1);
          if (a === null || b === null) return;
          const half = (b - a) / 2;
          const g = scope.context;
          g.fillStyle = colors.band;
          for (const time of bandTimes) {
            const x = scale.timeToCoordinate(time);
            if (x === null) continue;
            const left = Math.round((x - half) * scope.horizontalPixelRatio);
            const right = Math.round((x + half) * scope.horizontalPixelRatio);
            g.fillRect(left, 0, Math.max(1, right - left), scope.bitmapSize.height);
          }
        });
      },
    };
    const view = { zOrder: () => 'bottom', renderer: () => renderer };
    return { paneViews: () => [view], updateAllViews() {} };
  }

  // The price series in the style chosen (krx-quant #221): its kind of series and options. A
  // line, an area and a baseline draw the closes.
  let style = null;
  let baseValue = 0; // the baseline's base
  function styleOptions(kind) {
    const options = {
      // A Heikin-Ashi chart's price line is the last bar's own close (realLine), not its own.
      priceLineVisible: kind !== 'heikin_ashi',
      lastValueVisible: kind !== 'heikin_ashi',
      priceFormat: { type: 'price', precision: 0, minMove: 1 }, // won, as KRX stocks trade
    };
    const candle = {
      upColor: colors.up, downColor: colors.down, borderUpColor: colors.up, borderDownColor: colors.down,
      wickUpColor: colors.up, wickDownColor: colors.down,
    };
    switch (kind) {
      case 'bar':
        return [L.BarSeries, Object.assign(options, { upColor: colors.up, downColor: colors.down, thinBars: false })];
      case 'line':
        return [L.LineSeries, Object.assign(options, { color: colors.link, lineWidth: 2 })];
      case 'area':
        return [L.AreaSeries, Object.assign(options, {
          lineColor: colors.link, topColor: fade(colors.link, 0.35), bottomColor: fade(colors.link, 0.02), lineWidth: 2,
        })];
      case 'baseline':
        return [L.BaselineSeries, Object.assign(options, {
          baseValue: { type: 'price', price: baseValue }, lineWidth: 2,
          topLineColor: colors.up, topFillColor1: fade(colors.up, 0.28), topFillColor2: fade(colors.up, 0.05),
          bottomLineColor: colors.down, bottomFillColor1: fade(colors.down, 0.05), bottomFillColor2: fade(colors.down, 0.28),
        })];
      case 'hollow': // rising bars as outlines, falling ones filled
        return [L.CandlestickSeries, Object.assign(options, candle, { upColor: 'rgba(0,0,0,0)' })];
      default: // candles and Heikin-Ashi bars
        return [L.CandlestickSeries, Object.assign(options, candle)];
    }
  }
  function point(b) {
    return style === 'line' || style === 'area' || style === 'baseline' ? { time: b.time, value: b.close } : b;
  }

  let main = null;  // the price series
  let icons = null; // its markers
  let realLine = null; // a Heikin-Ashi chart's line at the last bar's own close
  function makeMain(kind) {
    style = kind;
    const [type, options] = styleOptions(kind);
    // Made before the old one goes, so the price pane is never empty (an empty pane is removed).
    const made = chart.addSeries(type, options, 0);
    if (main) {
      icons.detach();
      chart.removeSeries(main);
    }
    main = made;
    realLine = null;
    icons = L.createSeriesMarkers(main, []);
    main.attachPrimitive(bandPrimitive());
  }
  function showReal(last) {
    if (style !== 'heikin_ashi' || !last) {
      if (realLine) main.removePriceLine(realLine);
      realLine = null;
      return;
    }
    const options = {
      price: last.close, color: last.rising ? colors.up : colors.down, lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
    };
    if (realLine) realLine.applyOptions(options); else realLine = main.createPriceLine(options);
  }

  const volumes = chart.addSeries(
    L.HistogramSeries,
    { priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false },
    1 // the pane below
  );
  volumes.attachPrimitive(bandPrimitive());
  makeMain('candle');
  chart.panes()[0].setStretchFactor(0.78);
  chart.panes()[1].setStretchFactor(0.22);

  let fitRange = null;
  function fit() {
    if (fitRange) chart.timeScale().setVisibleLogicalRange(fitRange);
  }

  let bars = [];        // as drawn, oldest first
  let barAt = new Map(); // time -> index in bars
  let iconAt = new Map(); // time -> icon
  let hoverAt = new Map(); // time -> hover box (krx-quant #159)
  let hovered = null;      // the bar hovered: {time, x}, kept while the data is sent again

  // Fitted since the chart last emptied: another symbol is chosen by emptying the chart
  // first (KrxLive::select), and its first bars are fitted again.
  let shown = false;
  function show(data) {
    // Day candles (krx-quant #111) are dated: the axis and the crosshair show no time.
    chart.applyOptions({ timeScale: { timeVisible: !data.day } });
    if (data.style !== style) makeMain(data.style);
    if (data.base !== undefined) {
      baseValue = data.base;
      if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
    }
    bandTimes = data.bands;
    bars = data.bars;
    barAt = new Map(bars.map((b, i) => [b.time, i]));
    iconAt = new Map(data.icons.map((i) => [String(i.time), i]));
    main.setData(bars.map(point));
    volumes.setData(data.volumes);
    showReal(data.last);
    icons.setMarkers(data.icons.map((i) => ({
      id: String(i.time), time: i.time, position: i.position, shape: i.shape, color: i.color, size: i.size,
      text: i.text,
    })));
    fitRange = data.fit;
    if (!bars.length) {
      shown = false;
    } else if (!shown) { // the first bars: the last ones in view
      shown = true;
      fit();
    }
    redraw(); // the box hovered stays, over what was sent now
  }

  // Hover boxes set and dropped (krx-quant #159): only those changed come.
  function boxes(data) {
    if (data.reset) hoverAt = new Map();
    for (const box of data.set) hoverAt.set(box.time, box);
    for (const time of data.drop) hoverAt.delete(time);
    redraw();
  }

  // The bar being made moved (krx-quant #110): only the last bar is drawn again, or a new
  // one follows it. One older than the last drawn is not drawn.
  function live(data) {
    if (!bars.length || data.bar.time < bars[bars.length - 1].time) return;
    main.update(point(data.bar));
    volumes.update(data.volume);
    showReal(data.last);
    if (data.bar.time === bars[bars.length - 1].time) {
      bars[bars.length - 1] = data.bar;
    } else {
      barAt.set(data.bar.time, bars.length);
      bars.push(data.bar);
    }
  }

  // The hovered bar's four-minute window (krx-quant #167): the span from its bar close to four
  // minutes on, lightly filled; the touch targets across it, once its label is in (another kind's
  // two levels the same way: the range's, #182; the barrier's U and L, #185, from its bar close on
  // when the engine gives its mid-point with the prediction, #210); where each was first reached,
  // the upper in the rising colour, the lower in the falling one. A window not over yet runs
  // dotted into the free space on the right, its levels too.
  function xOf(time) {
    // A moment's x on the logical bars: within its minute's bar; in minutes without a bar
    // (the chart skips minutes without trades), at the edge where the next bar starts; past
    // the last bar, on the free space at a bar a minute.
    if (!bars.length || time < bars[0].time) return null;
    const last = bars.length - 1;
    let lo = 0, hi = last; // the last bar starting at or before ``time``
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (bars[mid].time <= time) lo = mid; else hi = mid - 1;
    }
    const into = time - bars[lo].time;
    return logicalX(lo - 0.5 + (lo === last ? into : Math.min(into, 60)) / 60);
  }

  // A fractional logical position's x, between those of the whole bars around it: the chart's own
  // logicalToCoordinate takes whole bars only (a fraction gave 0, so the window drew at the left
  // edge, krx-quant #182).
  function logicalX(logical) {
    const scale = chart.timeScale();
    const whole = Math.floor(logical);
    const a = scale.logicalToCoordinate(whole), b = scale.logicalToCoordinate(whole + 1);
    if (a === null || b === null) return null;
    return a + (b - a) * (logical - whole);
  }

  function drawWindow(box) {
    const ratio = window.devicePixelRatio || 1;
    links.width = area.clientWidth * ratio;
    links.height = area.clientHeight * ratio;
    const g = links.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, area.clientWidth, area.clientHeight);
    if (!box) return;
    const x1 = xOf(box.from), x2 = xOf(box.to);
    if (x1 === null || x2 === null) return;
    const open = !bars.length || box.to > bars[bars.length - 1].time + 60; // not over yet
    const foot = chart.panes()[0].getHeight();
    g.globalAlpha = 0.08;
    g.fillStyle = colors.link;
    g.fillRect(x1, 0, x2 - x1, foot);
    g.globalAlpha = 1;
    if (open) { // its end still to come: the window's edges dotted, targets or not
      g.strokeStyle = colors.link;
      g.lineWidth = 1;
      g.setLineDash([4, 3]);
      g.strokeRect(x1, 0, x2 - x1, foot);
    }
    g.lineWidth = 1.5;
    g.setLineDash(open ? [4, 3] : []);
    for (const [price, color] of [[box.upper, colors.up], [box.lower, colors.down]]) {
      if (price === undefined) continue;
      const y = main.priceToCoordinate(price);
      if (y === null) continue;
      g.strokeStyle = color;
      g.beginPath();
      g.moveTo(x1, y);
      g.lineTo(x2, y);
      g.stroke();
    }
    g.setLineDash([]);
    for (const [point, color] of [[box.upper_reached, colors.up], [box.lower_reached, colors.down]]) {
      if (!point) continue;
      const x = xOf(point.time), y = main.priceToCoordinate(point.price);
      if (x === null || y === null) continue;
      g.fillStyle = color;
      g.beginPath();
      g.arc(x, y, 4, 0, 2 * Math.PI);
      g.fill();
    }
  }

  function hide() {
    tip.style.display = 'none';
    drawWindow(null);
  }

  // The box of the bar under the pointer, anywhere on its column (krx-quant #159).
  function hover(param) {
    if (!param || !param.point || param.time === undefined) {
      hovered = null;
      return hide();
    }
    hovered = { time: param.time, x: param.point.x };
    redraw();
  }

  function redraw() {
    const box = hovered ? hoverAt.get(hovered.time) : undefined;
    if (!box) return hide();
    tip.textContent = box.lines.join('\n');
    tip.style.display = 'block';
    // At the foot of the price pane, on the side away from the pointer: it covers neither
    // the bar hovered nor its link. Kept inside the chart when it is tall.
    const right = hovered.x < area.clientWidth / 2;
    const foot = chart.panes()[0].getHeight();
    const top = Math.min(foot - tip.offsetHeight - 6, area.clientHeight - tip.offsetHeight - 6);
    tip.style.top = Math.max(6, top) + 'px';
    tip.style.left = right ? Math.max(6, area.clientWidth - tip.offsetWidth - 70) + 'px' : '6px';
    drawWindow(box);
  }
  chart.subscribeCrosshairMove(hover);

  // The view moved: near its left end the screen reads the bars before (krx-quant #108).
  // The chart keeps the view on the same bars when they come in before the first.
  chart.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
    if (range && bars.length && bridge) bridge.moved(range.from);
  });
  // The bars in view, by time: the score over them (krx-quant #159).
  chart.timeScale().subscribeVisibleTimeRangeChange(function (range) {
    if (range && bridge) bridge.range(range.from, range.to);
  });

  // An icon clicked: the screen shows that bar close's judgements (krx-quant #107).
  let bridge = null;
  chart.subscribeClick(function (param) {
    const icon = param && param.hoveredObjectId !== undefined ? iconAt.get(String(param.hoveredObjectId)) : undefined;
    if (icon && bridge) bridge.clicked(icon.bar_close);
  });

  function theme(t) {
    colors = t;
    document.body.style.background = t.background;
    tip.style.background = t.tip_background;
    tip.style.borderColor = t.tip_border;
    tip.style.color = t.tip_text;
    tip.style.fontFamily = t.font;
    tip.style.fontSize = (t.size + 1) + 'px';
    chart.applyOptions({
      layout: {
        background: { type: 'solid', color: t.background },
        textColor: t.text,
        fontFamily: t.font,
        fontSize: t.size,
        attributionLogo: false,
        panes: { separatorColor: t.border, separatorHoverColor: t.border },
      },
      grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
      rightPriceScale: { borderColor: t.border },
      timeScale: { borderColor: t.border },
      crosshair: {
        vertLine: { color: t.text, labelBackgroundColor: t.label },
        horzLine: { color: t.text, labelBackgroundColor: t.label },
      },
    });
    main.applyOptions(styleOptions(style)[1]);
  }

  // The baseline's base moved with the view (krx-quant #221).
  function rebase(data) {
    baseValue = data.base;
    if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
  }

  area.addEventListener('dblclick', fit);
  area.addEventListener('mouseleave', () => hover(null));
  window.addEventListener('resize', redraw);

  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.theme_changed.connect(function (json) { theme(JSON.parse(json)); });
    bridge.data_changed.connect(function (json) { show(JSON.parse(json)); });
    bridge.hovers_changed.connect(function (json) { boxes(JSON.parse(json)); });
    bridge.live_changed.connect(function (json) { live(JSON.parse(json)); });
    bridge.base_changed.connect(function (json) { rebase(JSON.parse(json)); });
    bridge.fit_requested.connect(fit);
    bridge.ready();
  });
})();
</script>
</body>
</html>
