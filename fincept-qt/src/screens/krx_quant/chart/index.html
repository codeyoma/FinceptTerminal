      timeScale: { borderColor: t.border },
      crosshair: {
        vertLine: { color: t.text, labelBackgroundColor: t.label },
        horzLine: { color: t.text, labelBackgroundColor: t.label },
      },
    });
    main.applyOptions(styleOptions(style)[1]);
    buildLegend();
  }

  function styleLegend(box) {
    box.style.color = colors.tip_text;
    if (colors.font) box.style.fontFamily = colors.font;
    if (colors.size) box.style.fontSize = (colors.size + 1) + 'px';
    box.style.setProperty('--hover', fade(colors.tip_background, 0.85));
    box.style.setProperty('--note', colors.link);
  }

  // The baseline's base moved with the view (krx-quant #221).
  function rebase(data) {
    baseValue = data.base;
    if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
  }

  // The volume profile of the bars now in view (krx-quant #222).
  function reprofile(data) {
    profile = data && data.rows ? data : null;
    repaint();
  }

  // The price pane's scale (krx-quant #245): 일반 or 로그, as the screen keeps it for every symbol.
  // The pane's price scale outlives the main series (makeMain), so it stays through a style changed;
  // the lower panes keep theirs. A click turns it at once and tells the screen.
  const scaleBox = document.getElementById('scale');
  let logScale = false;
  function setScale(log) {
    logScale = !!log;
    chart.priceScale('right', 0).applyOptions({
      mode: logScale ? L.PriceScaleMode.Logarithmic : L.PriceScaleMode.Normal,
    });
    for (const choice of scaleBox.children) choice.classList.toggle('on', (choice.dataset.log === '1') === logScale);
  }
  for (const choice of scaleBox.children) {
    choice.addEventListener('click', function () {
      const log = choice.dataset.log === '1';
      if (log === logScale) return;
      setScale(log);
      if (bridge) bridge.scaled(log);
    });
  }
  // As tall as the time axis, below its border line.
  function placeScale() { scaleBox.style.height = Math.max(0, chart.timeScale().height() - 1) + 'px'; }
  chart.timeScale().subscribeSizeChange(placeScale);
  setScale(false);
  placeScale();

  // For krx-capture and the page's tests (krx-quant #236): the x of the slot holding a moment
  // (chart_time; null before the first bar), and the view moved to show that slot in its middle, as
  // many bars wide as now (it stops following the latest bars, as a hand's move does).
  function slotAt(time) {
    if (!bars.length || time < bars[0].time) return null;
    let lo = 0, hi = bars.length - 1; // the last bar starting at or before ``time``
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (bars[mid].time <= time) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  window.krxChart = {
    x: function (time) {
      const i = slotAt(time);
      return i === null ? null : chart.timeScale().logicalToCoordinate(i);
    },
    show: function (time) {
      const i = slotAt(time);
      if (i === null) return false;
      const range = chart.timeScale().getVisibleLogicalRange();
      const width = range ? range.to - range.from : 66;
      following = false;
      chart.timeScale().setVisibleLogicalRange({ from: i - width / 2, to: i + width / 2 });
      return true;
    },
    bars: function () { return bars.map((b) => [b.time, b.close === undefined ? 0 : 1]); },
    tip: function () { return tip.style.display === 'none' ? '' : tip.textContent; },
    hovered: function () { return hovered ? [hovered.time, hoverAt.has(hovered.time)] : null; },
    // The price pane's scale mode (0 일반, 1 로그) and the choice shown on (krx-quant #245).
    scale: function () {
      return [chart.priceScale('right', 0).options().mode, scaleBox.querySelector('.on').textContent];
    },
  };

  area.addEventListener('dblclick', fit);
  area.addEventListener('mouseleave', () => hover(null));
  window.addEventListener('resize', function () { layoutPanes(); redraw(); });

  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.theme_changed.connect(function (json) { theme(JSON.parse(json)); });
    bridge.data_changed.connect(function (json) { show(JSON.parse(json)); });
    bridge.hovers_changed.connect(function (json) { boxes(JSON.parse(json)); });
    bridge.live_changed.connect(function (json) { live(JSON.parse(json)); });
    bridge.base_changed.connect(function (json) { rebase(JSON.parse(json)); });
    bridge.profile_changed.connect(function (json) { reprofile(JSON.parse(json)); });
    bridge.drawings_changed.connect(function (json) { showDrawings(JSON.parse(json)); });
    bridge.tool_changed.connect(function (json) { setTool(JSON.parse(json)); });
    bridge.fit_requested.connect(fit);
    bridge.scale_changed.connect(setScale);
    bridge.ready();
  });
})();
</script>
</body>
</html>
