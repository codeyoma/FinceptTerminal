<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  The KRX screen's chart (fork addition, codeyoma/krx-quant#105–#110, #159, #167, #182, #185,
  #221, #222), drawn with TradingView Lightweight Charts (NOTICE). It only draws what the screen
  sends over the web channel: the bars in the style chosen and their volumes, the days' first bars
  filled, the consensus icons, each bar's hover box and its four-minute window with two levels
  across it (the touch targets, the range's highest and lowest mid-points, or the barrier's U
  and L), the indicators (their lines, the fills between two, the fractals' marks, the volume
  profile's bars, the anchored VWAP's marker) with each pane's legend, the theme, and when to
  fit. It tells the screen where its view is, the legend's buttons, and the anchored VWAP's bar
  clicked or dragged to.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080808; }
  #chart, #links { position: absolute; inset: 0; }
  #links { pointer-events: none; z-index: 60; width: 100%; height: 100%; } /* above the chart's own canvases (z-index up to 50) */
  #tip {
    position: absolute; display: none; pointer-events: none; white-space: pre-wrap;
    padding: 4px 8px; border: 1px solid; z-index: 61;
    max-width: calc(100% - 30px); box-sizing: border-box; /* a long line wraps inside the chart */
  }
  /* Each pane's legend (krx-quant #222): top left, a row per indicator; hovered, its buttons. */
  .legend { position: absolute; left: 4px; z-index: 62; pointer-events: none; max-width: calc(100% - 80px); }
  .legend .row {
    pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; white-space: nowrap;
    padding: 0 4px; border-radius: 2px; line-height: 1.55; width: max-content; max-width: 100%;
  }
  .legend .row.hover { background: var(--hover); }
  .legend .name { font-weight: 700; }
  .legend .settings { opacity: 0.7; }
  .legend .row.hidden .name, .legend .row.hidden .settings { opacity: 0.4; }
  .legend .note { color: var(--note); }
  .legend .tools { display: none; gap: 1px; align-items: center; }
  .legend .row.hover .tools { display: inline-flex; }
  .legend .tools span { display: inline-flex; padding: 1px 2px; cursor: pointer; border-radius: 2px; opacity: 0.8; }
  .legend .tools span:hover { opacity: 1; background: var(--hover); }
  .legend svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.4; }
</style>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="chart"></div>
<canvas id="links"></canvas>
<div id="tip"></div>
<div id="legend0" class="legend"></div>
<div id="legend1" class="legend"></div>
<script>
(function () {
  const L = LightweightCharts;
  const area = document.getElementById('chart');
  const links = document.getElementById('links');
  const tip = document.getElementById('tip');
  const legendBoxes = [document.getElementById('legend0'), document.getElementById('legend1')];
  const chart = L.createChart(area, {
    autoSize: true,
    layout: { attributionLogo: false }, // the attribution is on the panel title and in the README
    // The latest target's slot shows on the right; on the left the view stops at the first bar
    // read, where the bars before are read (krx-quant #108).
    timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6, fixLeftEdge: true },
  });
  let colors = {
    tip_background: '#111', tip_border: '#333', tip_text: '#e5e5e5', link: '#f59e0b', up: '#16a34a', down: '#dc2626',
    band: 'rgba(128,128,128,0.22)', text: '#999',
  };

  // ``color`` (rgba(r,g,b,a) from the screen) at ``alpha``.
  function fade(color, alpha) {
    const m = /rgba?\(([^)]+)\)/.exec(color);
    return m ? 'rgba(' + m[1].split(',').slice(0, 3).join(',') + ',' + alpha + ')' : color;
  }

  // The days' first bars of a minute view, filled grey behind the bars (krx-quant #221): a band a
  // bar wide, the pane's height, in each pane it is attached to.
  let bandTimes = [];
  function bandPrimitive() {
    const renderer = {
      draw(target) {
        if (!bandTimes.length) return;
        target.useBitmapCoordinateSpace(function (scope) {
          const scale = chart.timeScale();
          const a = scale.logicalToCoordinate(0), b = scale.logicalToCoordinate(1);
          if (a === null || b === null) return;
          const half = (b - a) / 2;
          const g = scope.context;
          g.fillStyle = colors.band;
          for (const time of bandTimes) {
            const x = scale.timeToCoordinate(time);
            if (x === null) continue;
            const left = Math.round((x - half) * scope.horizontalPixelRatio);
            const right = Math.round((x + half) * scope.horizontalPixelRatio);
            g.fillRect(left, 0, Math.max(1, right - left), scope.bitmapSize.height);
          }
        });
      },
    };
    const view = { zOrder: () => 'bottom', renderer: () => renderer };
    return { paneViews: () => [view], updateAllViews() {} };
  }

  // A layer drawn in the price pane in its own coordinates (krx-quant #222): the fills between two
  // indicator lines, the volume profile, the anchored VWAP's marker.
  let redrawPrices = null; // asks the price pane to draw again (a layer's data changed)
  function layer(zOrder, draw) {
    const renderer = {
      draw(target) {
        target.useMediaCoordinateSpace(function (scope) { draw(scope.context, scope.mediaSize); });
      },
    };
    const view = { zOrder: () => zOrder, renderer: () => renderer };
    return {
      paneViews: () => [view],
      updateAllViews() {},
      attached(param) { redrawPrices = param.requestUpdate; },
    };
  }
  function repaint() { if (redrawPrices) redrawPrices(); }

  // The price series in the style chosen (krx-quant #221): its kind of series and options. A
  // line, an area and a baseline draw the closes.
  let style = null;
  let baseValue = 0; // the baseline's base
  function styleOptions(kind) {
    const options = {
      // A Heikin-Ashi chart's price line is the last bar's own close (realLine), not its own.
      priceLineVisible: kind !== 'heikin_ashi',
      lastValueVisible: kind !== 'heikin_ashi',
      priceFormat: { type: 'price', precision: 0, minMove: 1 }, // won, as KRX stocks trade
    };
    const candle = {
      upColor: colors.up, downColor: colors.down, borderUpColor: colors.up, borderDownColor: colors.down,
      wickUpColor: colors.up, wickDownColor: colors.down,
    };
    switch (kind) {
      case 'bar':
        return [L.BarSeries, Object.assign(options, { upColor: colors.up, downColor: colors.down, thinBars: false })];
      case 'line':
        return [L.LineSeries, Object.assign(options, { color: colors.link, lineWidth: 2 })];
      case 'area':
        return [L.AreaSeries, Object.assign(options, {
          lineColor: colors.link, topColor: fade(colors.link, 0.35), bottomColor: fade(colors.link, 0.02), lineWidth: 2,
        })];
      case 'baseline':
        return [L.BaselineSeries, Object.assign(options, {
          baseValue: { type: 'price', price: baseValue }, lineWidth: 2,
          topLineColor: colors.up, topFillColor1: fade(colors.up, 0.28), topFillColor2: fade(colors.up, 0.05),
          bottomLineColor: colors.down, bottomFillColor1: fade(colors.down, 0.05), bottomFillColor2: fade(colors.down, 0.28),
        })];
      case 'hollow': // rising bars as outlines, falling ones filled
        return [L.CandlestickSeries, Object.assign(options, candle, { upColor: 'rgba(0,0,0,0)' })];
      default: // candles and Heikin-Ashi bars
        return [L.CandlestickSeries, Object.assign(options, candle)];
    }
  }
  function point(b) {
    return style === 'line' || style === 'area' || style === 'baseline' ? { time: b.time, value: b.close } : b;
  }

  let main = null;  // the price series
  let icons = null; // its markers: the consensus icons and the fractals
  let iconMarks = []; // the consensus icons as markers
  let studyMarks = []; // the fractals as markers (krx-quant #222)
  // The indicators (krx-quant #222): a line series each in the price pane, kept by id while the
  // screen sends them again; the fills, the fractals, the volume profile and the anchor are layers.
  const lines = new Map(); // id -> {series, times: [time…], values: Map(time -> value)}
  let fills = [];
  let profile = null;  // {color, rows: [{low, high, volume}]}
  let anchor = null;   // {time, color}
  let dragTime = null; // the bar the anchor's marker is dragged to
  let picking = false; // the next click on the chart anchors the anchored VWAP
  let legendRows = []; // as sent
  let realLine = null; // a Heikin-Ashi chart's line at the last bar's own close
  function makeMain(kind) {
    style = kind;
    const [type, options] = styleOptions(kind);
    // Made before the old one goes, so the price pane is never empty (an empty pane is removed).
    const made = chart.addSeries(type, options, 0);
    if (main) {
      icons.detach();
      chart.removeSeries(main);
    }
    main = made;
    realLine = null;
    icons = L.createSeriesMarkers(main, []);
    main.attachPrimitive(bandPrimitive());
    main.attachPrimitive(layer('bottom', drawFills));
    main.attachPrimitive(layer('bottom', drawProfile));
    main.attachPrimitive(layer('top', drawAnchor));
    showMarks();
  }
  function showReal(last) {
    if (style !== 'heikin_ashi' || !last) {
      if (realLine) main.removePriceLine(realLine);
      realLine = null;
      return;
    }
    const options = {
      price: last.close, color: last.rising ? colors.up : colors.down, lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
    };
    if (realLine) realLine.applyOptions(options); else realLine = main.createPriceLine(options);
  }

  // The volumes in the pane below, while the volume is on (krx-quant #222: an indicator of the
  // lower list); turned off, its pane goes.
  let volumes = null;
  let volumeData = [];
  let volumeAt = new Map(); // time -> volume, for the legend
  function showVolume(on, hidden) {
    if (on && !volumes) {
      volumes = chart.addSeries(
        L.HistogramSeries,
        { priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false },
        1 // the pane below
      );
      volumes.attachPrimitive(bandPrimitive());
      volumes.setData(volumeData);
      chart.panes()[0].setStretchFactor(0.78);
      chart.panes()[1].setStretchFactor(0.22);
    } else if (!on && volumes) {
      chart.removeSeries(volumes); // its pane goes with it
      volumes = null;
    }
    if (volumes) volumes.applyOptions({ visible: !hidden });
  }
  makeMain('candle');
  showVolume(true, false);

  let fitRange = null;
  function fit() {
    if (fitRange) chart.timeScale().setVisibleLogicalRange(fitRange);
  }

  let bars = [];        // as drawn, oldest first
  let barAt = new Map(); // time -> index in bars
  let iconAt = new Map(); // time -> icon
  let hoverAt = new Map(); // time -> hover box (krx-quant #159)
  let hovered = null;      // the bar hovered: {time, x}, kept while the data is sent again
  function showMarks() {
    const all = iconMarks.concat(studyMarks);
    all.sort((a, b) => a.time - b.time);
    icons.setMarkers(all);
  }

  // Fitted since the chart last emptied: another symbol is chosen by emptying the chart
  // first (KrxLive::select), and its first bars are fitted again.
  let shown = false;
  function show(data) {
    // Day candles (krx-quant #111) are dated: the axis and the crosshair show no time.
    chart.applyOptions({ timeScale: { timeVisible: !data.day } });
    if (data.style !== style) makeMain(data.style);
    if (data.base !== undefined) {
      baseValue = data.base;
      if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
    }
    bandTimes = data.bands;
    bars = data.bars;
    barAt = new Map(bars.map((b, i) => [b.time, i]));
    iconAt = new Map(data.icons.map((i) => [String(i.time), i]));
    main.setData(bars.map(point));
    volumeData = data.volumes;
    volumeAt = new Map(volumeData.map((v) => [v.time, v.value]));
    if (volumes) volumes.setData(volumeData);
    showReal(data.last);
    iconMarks = data.icons.map((i) => ({
      id: String(i.time), time: i.time, position: i.position, shape: i.shape, color: i.color, size: i.size,
      text: i.text,
    }));
    showStudies(data.studies || {}, data.profile || {});
    fitRange = data.fit;
    if (!bars.length) {
      shown = false;
    } else if (!shown) { // the first bars: the last ones in view
      shown = true;
      fit();
    }
    redraw(); // the box hovered stays, over what was sent now
  }

  function pointOf(p) {
    return p.length > 1 ? { time: p[0], value: p[1] } : { time: p[0] };
  }
  function lineOptions(line) {
    const options = {
      color: line.color, lineWidth: line.width, lineVisible: !line.dots, pointMarkersVisible: !!line.dots,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      priceFormat: { type: 'price', precision: 0, minMove: 1 },
    };
    if (line.dots) options.pointMarkersRadius = line.width + 0.5;
    return options;
  }

  function showStudies(s, profileData) {
    const keep = new Set();
    for (const line of s.series || []) {
      keep.add(line.id);
      let entry = lines.get(line.id);
      if (!entry) {
        entry = { series: chart.addSeries(L.LineSeries, lineOptions(line), 0) };
        lines.set(line.id, entry);
      } else {
        entry.series.applyOptions(lineOptions(line));
      }
      entry.series.setData(line.points.map(pointOf));
      entry.times = line.points.map((p) => p[0]);
      entry.values = new Map();
      for (const p of line.points) if (p.length > 1) entry.values.set(p[0], p[1]);
    }
    for (const [id, entry] of lines) {
      if (keep.has(id)) continue;
      chart.removeSeries(entry.series);
      lines.delete(id);
    }
    fills = s.fills || [];
    studyMarks = (s.marks || []).map((m) => ({
      id: 'f' + m.time + (m.above ? 'u' : 'd'), time: m.time, position: m.above ? 'aboveBar' : 'belowBar',
      shape: m.above ? 'arrowUp' : 'arrowDown', color: m.color, size: 1,
    }));
    showMarks();
    profile = profileData && profileData.rows ? profileData : null;
    anchor = s.anchor || null;
    picking = !!s.picking;
    area.style.cursor = picking ? 'crosshair' : '';
    showVolume(s.volume !== false, !!s.volume_hidden);
    legendRows = s.legend || [];
    buildLegend();
    repaint();
  }

  // Between two lines, filled: the first's colour where it is above (krx-quant #222).
  function drawFills(g, size) {
    const scale = chart.timeScale();
    for (const f of fills) {
      const a = lines.get(f.a), b = lines.get(f.b);
      if (!a || !b) continue;
      let before = null; // the point before, both lines there: [x, ya, yb, va, vb]
      for (const time of a.times) {
        const va = a.values.get(time), vb = b.values.get(time);
        const x = scale.timeToCoordinate(time);
        if (va === undefined || vb === undefined || x === null) { before = null; continue; }
        const ya = main.priceToCoordinate(va), yb = main.priceToCoordinate(vb);
        if (ya === null || yb === null) { before = null; continue; }
        if (before && x >= -50 && before[0] <= size.width + 50) {
          g.fillStyle = va + before[3] >= vb + before[4] ? f.up : f.down;
          g.beginPath();
          g.moveTo(before[0], before[1]);
          g.lineTo(x, ya);
          g.lineTo(x, yb);
          g.lineTo(before[0], before[2]);
          g.closePath();
          g.fill();
        }
        before = [x, ya, yb, va, vb];
      }
    }
  }

  // The volume profile of the bars in view (krx-quant #222): a bar per price row from the right
  // edge, the longest a quarter of the pane wide.
  function drawProfile(g, size) {
    if (!profile || !profile.rows.length) return;
    const most = Math.max.apply(null, profile.rows.map((r) => r.volume));
    if (!(most > 0)) return;
    const widest = size.width * 0.25;
    g.fillStyle = profile.color;
    for (const row of profile.rows) {
      const top = main.priceToCoordinate(row.high), bottom = main.priceToCoordinate(row.low);
      if (top === null || bottom === null) continue;
      const width = (row.volume / most) * widest;
      const height = Math.max(1, bottom - top - 1);
      g.fillRect(size.width - width, top, width, height);
    }
  }

  // The anchored VWAP's bar (krx-quant #222): a dashed line down the price pane with a handle at
  // its foot. Dragged, it follows the pointer to a bar.
  function anchorX() {
    const time = dragTime !== null ? dragTime : anchor ? anchor.time : null;
    return time === null ? null : chart.timeScale().timeToCoordinate(time);
  }
  function drawAnchor(g, size) {
    if (!anchor) return;
    const x = anchorX();
    if (x === null) return;
    g.strokeStyle = anchor.color;
    g.globalAlpha = 0.75;
    g.lineWidth = 1;
    g.setLineDash([4, 3]);
    g.beginPath();
    g.moveTo(x, 0);
    g.lineTo(x, size.height);
    g.stroke();
    g.setLineDash([]);
    g.globalAlpha = 1;
    g.fillStyle = anchor.color;
    g.beginPath(); // a diamond at the foot: the handle
    g.moveTo(x, size.height - 16);
    g.lineTo(x + 6, size.height - 10);
    g.lineTo(x, size.height - 4);
    g.lineTo(x - 6, size.height - 10);
    g.closePath();
    g.fill();
  }
  // The bar under ``x``: the nearest, within the bars read.
  function barTimeAt(x) {
    const logical = chart.timeScale().coordinateToLogical(x);
    if (logical === null || !bars.length) return null;
    return bars[Math.max(0, Math.min(bars.length - 1, Math.round(logical)))].time;
  }
  area.addEventListener('mousedown', function (e) {
    if (!anchor || e.button !== 0) return;
    const box = area.getBoundingClientRect();
    const x = e.clientX - box.left, y = e.clientY - box.top;
    const ax = anchorX();
    if (ax === null || Math.abs(x - ax) > 6 || y > chart.panes()[0].getHeight()) return;
    // Grabbed: the chart does not scroll while the marker moves.
    e.stopPropagation();
    e.preventDefault();
    chart.applyOptions({ handleScroll: false, handleScale: false });
    dragTime = anchor.time;
    document.body.style.cursor = 'ew-resize';
    const move = function (m) {
      const time = barTimeAt(m.clientX - box.left);
      if (time !== null && time !== dragTime) { dragTime = time; repaint(); }
    };
    const up = function () {
      window.removeEventListener('mousemove', move, true);
      window.removeEventListener('mouseup', up, true);
      chart.applyOptions({ handleScroll: true, handleScale: true });
      document.body.style.cursor = '';
      if (dragTime !== null && dragTime !== anchor.time && bridge) bridge.anchored(dragTime);
      if (dragTime !== null) anchor = { time: dragTime, color: anchor.color }; // until the screen sends it
      dragTime = null;
      repaint();
    };
    window.addEventListener('mousemove', move, true);
    window.addEventListener('mouseup', up, true);
  }, true);

  // Each pane's legend (krx-quant #222): a row per indicator with its name, its settings and its
  // lines' values at the crosshair (or the last bar). Hovered, a row shows its buttons: hide (the
  // eye), settings and delete; the screen does what they ask.
  const ICONS = {
    eye: '<svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
    hidden: '<svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><path d="M2.5 13.5l11-11"/></svg>',
    settings: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"/></svg>',
    remove: '<svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  };
  let valueSpans = []; // [{span, id}] of the rows built
  let missingSpans = []; // [{span, ids}]: a row's reason, shown where none of its lines has a value
  function buildLegend() {
    valueSpans = [];
    missingSpans = [];
    for (const box of legendBoxes) box.textContent = '';
    for (const row of legendRows) {
      const box = legendBoxes[row.pane] || legendBoxes[0];
      const el = document.createElement('div');
      el.className = 'row' + (row.hidden ? ' hidden' : '');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = row.title;
      el.appendChild(name);
      if (row.settings) {
        const settings = document.createElement('span');
        settings.className = 'settings';
        settings.textContent = row.settings;
        el.appendChild(settings);
      }
      if (!row.hidden) {
        row.values.forEach(function (id, i) {
          const span = document.createElement('span');
          span.style.color = row.colors[i] || colors.text;
          el.appendChild(span);
          valueSpans.push({ span: span, id: id });
        });
      }
      if (row.missing && !row.hidden) { // e.g. the VWAP of a day not read whole
        const missing = document.createElement('span');
        missing.className = 'note';
        missing.textContent = row.missing;
        el.appendChild(missing);
        missingSpans.push({ span: missing, ids: row.values });
      }
      if (row.note) {
        const note = document.createElement('span');
        note.className = 'note';
        note.textContent = row.note;
        el.appendChild(note);
      }
      const tools = document.createElement('span');
      tools.className = 'tools';
      for (const [action, icon, title] of [
        ['hide', row.hidden ? ICONS.hidden : ICONS.eye, row.hidden ? '보이기' : '숨기기'],
        ['settings', ICONS.settings, '설정'],
        ['remove', ICONS.remove, '삭제'],
      ]) {
        const button = document.createElement('span');
        button.innerHTML = icon;
        button.title = title;
        button.addEventListener('click', function (e) {
          e.stopPropagation();
          if (bridge) bridge.legend(row.key, action);
        });
        tools.appendChild(button);
      }
      el.appendChild(tools);
      // Its buttons while hovered (a class, so a synthetic hover shows them too).
      el.addEventListener('mouseenter', function () { el.classList.add('hover'); });
      el.addEventListener('mouseleave', function () { el.classList.remove('hover'); });
      box.appendChild(el);
    }
    placeLegend();
    showLegendValues(legendTime);
  }
  // The values at ``time`` (the crosshair's), or at the last bar when there is none.
  let legendTime = null;
  function showLegendValues(time) {
    legendTime = time;
    const at = time !== null && time !== undefined ? time : bars.length ? bars[bars.length - 1].time : null;
    const valueAt = function (id) {
      return id === 'volume' ? volumeAt.get(at) : (lines.get(id) || { values: new Map() }).values.get(at);
    };
    for (const { span, id } of valueSpans) {
      const value = valueAt(id);
      span.textContent = value === undefined ? '' : Math.round(value).toLocaleString('en-US');
      span.style.display = value === undefined ? 'none' : '';
    }
    for (const { span, ids } of missingSpans)
      span.style.display = ids.some((id) => valueAt(id) !== undefined) ? 'none' : '';
  }
  function placeLegend() {
    legendBoxes[0].style.top = '4px';
    const panes = chart.panes();
    legendBoxes[1].style.display = panes.length > 1 ? '' : 'none';
    if (panes.length > 1) legendBoxes[1].style.top = (panes[0].getHeight() + 1 + 4) + 'px';
  }
  setInterval(placeLegend, 300); // the panes' border dragged

  // Hover boxes set and dropped (krx-quant #159): only those changed come.
  function boxes(data) {
    if (data.reset) hoverAt = new Map();
    for (const box of data.set) hoverAt.set(box.time, box);
    for (const time of data.drop) hoverAt.delete(time);
    redraw();
  }

  // The bar being made moved (krx-quant #110): only the last bar is drawn again, or a new
  // one follows it. One older than the last drawn is not drawn. The indicators' points it moves
  // come with it (krx-quant #222): each the last of its line.
  function live(data) {
    if (!bars.length || data.bar.time < bars[bars.length - 1].time) return;
    main.update(point(data.bar));
    if (volumes) volumes.update(data.volume);
    volumeAt.set(data.volume.time, data.volume.value);
    showReal(data.last);
    if (data.bar.time === bars[bars.length - 1].time) {
      bars[bars.length - 1] = data.bar;
    } else {
      barAt.set(data.bar.time, bars.length);
      bars.push(data.bar);
    }
    for (const [id, p] of data.studies || []) {
      const entry = lines.get(id);
      if (!entry) continue;
      try {
        entry.series.update(pointOf(p));
      } catch (e) {
        continue; // before its last point: drawn again at the bar close
      }
      if (!entry.times.length || entry.times[entry.times.length - 1] < p[0]) entry.times.push(p[0]);
      if (p.length > 1) entry.values.set(p[0], p[1]); else entry.values.delete(p[0]);
    }
    if (data.marks) {
      studyMarks = data.marks.map((m) => ({
        id: 'f' + m.time + (m.above ? 'u' : 'd'), time: m.time, position: m.above ? 'aboveBar' : 'belowBar',
        shape: m.above ? 'arrowUp' : 'arrowDown', color: m.color, size: 1,
      }));
      showMarks();
    }
    if (data.profile) profile = data.profile.rows ? data.profile : null;
    showLegendValues(legendTime);
    repaint();
  }

  // The hovered bar's four-minute window (krx-quant #167): the span from its bar close to four
  // minutes on, lightly filled; the touch targets across it, once its label is in (another kind's
  // two levels the same way: the range's, #182; the barrier's U and L, #185, from its bar close on
  // when the engine gives its mid-point with the prediction, #210); where each was first reached,
  // the upper in the rising colour, the lower in the falling one. A window not over yet runs
  // dotted into the free space on the right, its levels too.
  function xOf(time) {
    // A moment's x on the logical bars: within its minute's bar; in minutes without a bar
    // (the chart skips minutes without trades), at the edge where the next bar starts; past
    // the last bar, on the free space at a bar a minute.
    if (!bars.length || time < bars[0].time) return null;
    const last = bars.length - 1;
    let lo = 0, hi = last; // the last bar starting at or before ``time``
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (bars[mid].time <= time) lo = mid; else hi = mid - 1;
    }
    const into = time - bars[lo].time;
    return logicalX(lo - 0.5 + (lo === last ? into : Math.min(into, 60)) / 60);
  }

  // A fractional logical position's x, between those of the whole bars around it: the chart's own
  // logicalToCoordinate takes whole bars only (a fraction gave 0, so the window drew at the left
  // edge, krx-quant #182).
  function logicalX(logical) {
    const scale = chart.timeScale();
    const whole = Math.floor(logical);
    const a = scale.logicalToCoordinate(whole), b = scale.logicalToCoordinate(whole + 1);
    if (a === null || b === null) return null;
    return a + (b - a) * (logical - whole);
  }

  function drawWindow(box) {
    const ratio = window.devicePixelRatio || 1;
    links.width = area.clientWidth * ratio;
    links.height = area.clientHeight * ratio;
    const g = links.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);
    g.clearRect(0, 0, area.clientWidth, area.clientHeight);
    if (!box) return;
    const x1 = xOf(box.from), x2 = xOf(box.to);
    if (x1 === null || x2 === null) return;
    const open = !bars.length || box.to > bars[bars.length - 1].time + 60; // not over yet
    const foot = chart.panes()[0].getHeight();
    g.globalAlpha = 0.08;
    g.fillStyle = colors.link;
    g.fillRect(x1, 0, x2 - x1, foot);
    g.globalAlpha = 1;
    if (open) { // its end still to come: the window's edges dotted, targets or not
      g.strokeStyle = colors.link;
      g.lineWidth = 1;
      g.setLineDash([4, 3]);
      g.strokeRect(x1, 0, x2 - x1, foot);
    }
    g.lineWidth = 1.5;
    g.setLineDash(open ? [4, 3] : []);
    for (const [price, color] of [[box.upper, colors.up], [box.lower, colors.down]]) {
      if (price === undefined) continue;
      const y = main.priceToCoordinate(price);
      if (y === null) continue;
      g.strokeStyle = color;
      g.beginPath();
      g.moveTo(x1, y);
      g.lineTo(x2, y);
      g.stroke();
    }
    g.setLineDash([]);
    for (const [point, color] of [[box.upper_reached, colors.up], [box.lower_reached, colors.down]]) {
      if (!point) continue;
      const x = xOf(point.time), y = main.priceToCoordinate(point.price);
      if (x === null || y === null) continue;
      g.fillStyle = color;
      g.beginPath();
      g.arc(x, y, 4, 0, 2 * Math.PI);
      g.fill();
    }
  }

  function hide() {
    tip.style.display = 'none';
    drawWindow(null);
  }

  // The box of the bar under the pointer, anywhere on its column (krx-quant #159); the legend's
  // values at it (krx-quant #222).
  function hover(param) {
    if (!param || !param.point || param.time === undefined) {
      hovered = null;
      showLegendValues(null);
      return hide();
    }
    hovered = { time: param.time, x: param.point.x };
    showLegendValues(param.time);
    redraw();
  }

  function redraw() {
    const box = hovered ? hoverAt.get(hovered.time) : undefined;
    if (!box) return hide();
    tip.textContent = box.lines.join('\n');
    tip.style.display = 'block';
    // At the foot of the price pane, on the side away from the pointer: it covers neither
    // the bar hovered nor its link. Kept inside the chart when it is tall.
    const right = hovered.x < area.clientWidth / 2;
    const foot = chart.panes()[0].getHeight();
    const top = Math.min(foot - tip.offsetHeight - 6, area.clientHeight - tip.offsetHeight - 6);
    tip.style.top = Math.max(6, top) + 'px';
    tip.style.left = right ? Math.max(6, area.clientWidth - tip.offsetWidth - 70) + 'px' : '6px';
    drawWindow(box);
  }
  chart.subscribeCrosshairMove(hover);

  // The view moved: near its left end the screen reads the bars before (krx-quant #108).
  // The chart keeps the view on the same bars when they come in before the first.
  chart.timeScale().subscribeVisibleLogicalRangeChange(function (range) {
    if (range && bars.length && bridge) bridge.moved(range.from);
  });
  // The bars in view, by time: the score over them (krx-quant #159), the volume profile
  // (krx-quant #222).
  chart.timeScale().subscribeVisibleTimeRangeChange(function (range) {
    if (range && bridge) bridge.range(range.from, range.to);
  });

  // An icon clicked: the screen shows that bar close's judgements (krx-quant #107). While the
  // anchored VWAP waits for its bar (krx-quant #222), a click anywhere chooses the bar under it.
  let bridge = null;
  chart.subscribeClick(function (param) {
    if (picking && param && param.point && bars.length && bridge) {
      const time = barTimeAt(param.point.x);
      if (time !== null) {
        picking = false;
        area.style.cursor = '';
        bridge.anchored(time);
      }
      return;
    }
    const icon = param && param.hoveredObjectId !== undefined ? iconAt.get(String(param.hoveredObjectId)) : undefined;
    if (icon && bridge) bridge.clicked(icon.bar_close);
  });

  function theme(t) {
    colors = t;
    document.body.style.background = t.background;
    tip.style.background = t.tip_background;
    tip.style.borderColor = t.tip_border;
    tip.style.color = t.tip_text;
    tip.style.fontFamily = t.font;
    tip.style.fontSize = (t.size + 1) + 'px';
    for (const box of legendBoxes) {
      box.style.color = t.tip_text;
      box.style.fontFamily = t.font;
      box.style.fontSize = (t.size + 1) + 'px';
      box.style.setProperty('--hover', fade(t.tip_background, 0.85));
      box.style.setProperty('--note', t.link);
    }
    chart.applyOptions({
      layout: {
        background: { type: 'solid', color: t.background },
        textColor: t.text,
        fontFamily: t.font,
        fontSize: t.size,
        attributionLogo: false,
        panes: { separatorColor: t.border, separatorHoverColor: t.border },
      },
      grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
      rightPriceScale: { borderColor: t.border },
      timeScale: { borderColor: t.border },
      crosshair: {
        vertLine: { color: t.text, labelBackgroundColor: t.label },
        horzLine: { color: t.text, labelBackgroundColor: t.label },
      },
    });
    main.applyOptions(styleOptions(style)[1]);
    buildLegend();
  }

  // The baseline's base moved with the view (krx-quant #221).
  function rebase(data) {
    baseValue = data.base;
    if (style === 'baseline') main.applyOptions({ baseValue: { type: 'price', price: baseValue } });
  }

  // The volume profile of the bars now in view (krx-quant #222).
  function reprofile(data) {
    profile = data && data.rows ? data : null;
    repaint();
  }

  area.addEventListener('dblclick', fit);
  area.addEventListener('mouseleave', () => hover(null));
  window.addEventListener('resize', function () { redraw(); placeLegend(); });

  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.theme_changed.connect(function (json) { theme(JSON.parse(json)); });
    bridge.data_changed.connect(function (json) { show(JSON.parse(json)); });
    bridge.hovers_changed.connect(function (json) { boxes(JSON.parse(json)); });
    bridge.live_changed.connect(function (json) { live(JSON.parse(json)); });
    bridge.base_changed.connect(function (json) { rebase(JSON.parse(json)); });
    bridge.profile_changed.connect(function (json) { reprofile(JSON.parse(json)); });
    bridge.fit_requested.connect(fit);
    bridge.ready();
  });
})();
</script>
</body>
</html>
